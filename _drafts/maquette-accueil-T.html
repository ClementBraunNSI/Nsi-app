"k":"tp","a":1,"m":"","b":null,"p":"csv_texte = \"\"\"Nom,Espece,Habitat,Poids_kg,Longueur_cm Rusty,Vulpes vulpes,Forêt tempérée,6.5,58 Arctic,Vulpes lagopus,Toundra arctique,3.2,46 Fennec,Vulpes zerda,Désert,1.5,24 Silver,Vulpes vulpes,Forêt boréale,7.1,61\"\"\"","h":[]}]},{"n":"Internet","img":"chapitres/1/chap_internet.png","list":[{"s":"activite_internet_interactive","t":"Atelier Internet : Le Routage","d":"Simuler l'envoi d'un paquet à travers le réseau Internet.","k":"tp","a":1,"m":"","b":null,"p":"Internet est un réseau de réseaux. Lorsqu'on envoie une donnée (un paquet), elle passe par plusieurs routeurs avant d'arriver à destination.","h":["🎯 Simulation"]},{"s":"Cours_Internet","t":"Internet","d":"L'histoire et le fonctionnement du réseau mondial, des pionniers à la révolution TCP/IP.","k":"cours","a":1,"m":"","b":null,"p":"Quand on dit « je vais sur Internet », on pense souvent à un site ou à une application. En réalité, on utilise un immense réseau de machines qui s'échangent des données. Le cours d'aujourd'hui sert à voir comment ce réseau s'est construit, puis comment une information trouve son chemin d'un appareil à un autre.","h":["D'où vient Internet","De quoi est fait un réseau","Comment une machine est reconnue","Le masque, ou comment savoir si l'on reste chez soi","Comment les données voyagent : TCP/IP","Le DNS, l'annuaire","Deux façons de s'organiser","Internet est physique"]},{"s":"Binaire_Decimal","t":"Le binaire : Définition","d":"Comprendre la base 2, les bits, octets et les conversions avec le décimal.","k":"cours","a":1,"m":"","b":null,"p":"Nous comptons d'habitude en base 10. Cela veut dire que nous disposons de dix symboles, de 0 à 9, et que la position d'un chiffre change sa valeur. L'informatique n'a pas dix symboles. Elle en a deux : 0 et 1. On les appelle des bits. Huit bits regroupés forment un octet.","h":["Compter en base 10, pour s'en souvenir","Du binaire vers le décimal","Du décimal vers le binaire"]},{"s":"Activite","t":"Simulation d'un Réseau Informatique","d":"Découverte du logiciel Filius pour simuler des réseaux et comprendre les échanges de données.","k":"tp","a":1,"m":"","b":null,"p":"Réaliser le schéma ci-dessus en utilisant le mode construction de Filius.","h":["🔧 Approche du logiciel Filius","🏗️ Construction d'un réseau simple","🚀 Un réseau plus étoffé"]},{"s":"Activite_2","t":"Simulation de Serveurs WEB et DNS","d":"Mise en place de serveurs WEB et DNS dans un réseau simulé avec Filius.","k":"tp","a":1,"m":"","b":null,"p":"","h":["🔧 Création du réseau","🖥️ Configuration d'un serveur WEB","🌐 Configuration d'un serveur DNS","📄 Ajout de votre page web personnalisée"]}]},{"n":"Photographie Numérique","img":"chapitres/1/chap_photo.png","list":[{"s":"activite_photo_interactive","t":"Atelier Photo : Le modèle RVB","d":"Comprendre comment les couleurs sont formées avec Rouge, Vert et Bleu.","k":"tp","a":1,"m":"","b":null,"p":"Les écrans utilisent le modèle RVB (Rouge, Vert, Bleu) pour afficher des millions de couleurs. Chaque pixel est composé de ces trois sous-pixels.","h":["🎯 Expérimentation","📸 Traitement d'Image"]},{"s":"metadonnees","t":"Métadonnées et Formats","d":"Comprendre les formats de fichiers image, la compression et les métadonnées EXIF","k":"cours","a":1,"m":"","b":null,"p":"Une image « brute », au format RAW, garde à peu près tout ce que le capteur a vu. Elle est fidèle, et elle est énorme. Pour la stocker ou l'envoyer, on choisit un format de fichier, et ce choix décide de ce qu'on accepte de perdre.","h":["Ce que le fichier sait en plus des pixels","Les lire","Pour s'entraîner"]},{"s":"photographie_couleur","t":"Photographie Couleur","d":"Comprendre la synthèse additive, le modèle RGB et la profondeur de couleur","k":"cours","a":1,"m":"","b":null,"p":"Un écran ne peint pas. Il allume de toutes petites lumières, et c'est votre œil qui en fait une couleur. Pour comprendre le codage, il faut donc commencer par la rétine, pas par le fichier.","h":["Ce que l'œil fait déjà","Additionner des lumières","Comment on code un pixel","Combien pèse l'image","Changer les couleurs, pixel par pixel","Compresser","Les métadonnées voyagent avec l'image","Le droit à l'image"]},{"s":"photographie_noir_et_blanc","t":"Photographie Noir et Blanc","d":"Comprendre la numérisation des images en noir et blanc, les pixels et la définition","k":"cours","a":1,"m":"","b":null,"p":"Avant de parler de couleur, il faut voir comment une image devient une suite de nombres. Le noir et blanc est le cas le plus simple : chaque point n'a qu'une luminosité, pas trois composantes.","h":["De la lumière aux nombres","Coder le noir, le blanc, et les gris","Le négatif"]},{"s":"TP_Python_Photographie","t":"TP Python : Photographie numérique","d":"Manipuler des pixels et des images avec la bibliothèque Pillow (PIL).","k":"tp","a":1,"m":"","b":null,"p":"","h":[]}]},{"n":"Localisation","img":"chapitres/1/chap_geoloc.png","list":[{"s":"activite_localisation_interactive","t":"Atelier Localisation : Trilateration","d":"Comprendre le fonctionnement du GPS avec les satellites.","k":"tp","a":1,"m":"","b":null,"p":"Pour calculer ta position, ton téléphone écoute les signaux d'au moins 3 satellites. C'est le principe de la trilatération.","h":[]},{"s":"Cours_Localisation","t":"La Géolocalisation","d":"Fonctionnement du GPS, enjeux de vie privée et cartographie numérique.","k":"cours","a":1,"m":"","b":null,"p":"Votre téléphone le fait plusieurs fois par jour, souvent sans que vous le demandiez. Le cours sert à voir d'où vient cette position, comment on la calcule, et ce qu'elle révèle quand elle reste collée à une photo.","h":["D'un système militaire à une puce dans la poche","Trois nombres pour un point","Comment le récepteur se situe","Afficher le point sur une carte","Trouver un chemin","La phrase que le GPS envoie","Exercices d'application"]},{"s":"projet_carte_gps","t":"Mini-projet : Carte GPS du Renard","d":"Modifier du code Python pour placer des points sur une carte interactive avec folium.","k":"projet","a":1,"m":"","b":null,"p":"Le but de ce projet est de construire une carte interactive du passage du renard, en modifiant du code Python. Dans ce projet, nous allons afficher une carte de France, poser des marqueurs, parcourir une liste de lieux, puis ajouter votre propre endroit.","h":["Une carte de France 🗺️","Le marqueur de Paris 📍","Lyon et Marseille 🏙️","Une boucle sur les lieux 🔁","Votre lieu 🏫","Le trajet (bonus) 🧵"]},{"s":"tp_python_localisation","t":"TP Python : Géolocalisation","d":"Manipuler des coordonnées GPS avec pandas, folium (cartes) et geopy (distances). Puis mini-projet carte interactive.","k":"projet","a":1,"m":"","b":null,"p":"assert 'ville_nord' in locals(), \"Créez la variable ville_nord.\" assert ville_nord == attendu, \"Trouvez la ville avec la latitude la plus élevée.\"","h":["Suite : mini-projet carte interactive"]}]},{"n":"Micro-controleurs","img":"chapitres/1/chap_microcontrol.png","list":[{"s":"activite_objets_connectes","t":"Activité : Composer un système connecté","d":"Assembler capteurs, logique et actionneurs pour simuler une alarme IoT.","k":"tp","a":1,"m":"","b":null,"p":"Pour écrire du code Python sur la carte (ou son simulateur en ligne), utilisez l'éditeur officiel :","h":["Mission : l'alarme anti-intrusion","Programmer une vraie Micro:bit","Extension (optionnel)"]},{"s":"objets_connectes","t":"Objets Connectés","d":"Comprendre l'Internet des Objets (IoT), les capteurs et les protocoles","k":"cours","a":1,"m":"","b":null,"p":"On date souvent le mot de 1999, même si des machines reliées à un réseau existent dès les années 1980. Aujourd'hui, les montres, les enceintes, certaines voitures et une foule de capteurs industriels en font partie. L'objet n'est plus seulement un outil qu'on allume. Il mesure quelque chose, et il en parle à une…","h":["Ce qu'il y a dedans","Comment ils se parlent","Le trajet d'une mesure","Où on les trouve","L'interface, le morceau que vous voyez","Il attend des événements","Le maillon faible"]},{"s":"simulateur_microbit","t":"Simulateur Micro:bit","d":"Programmer la carte Micro:bit avec le simulateur en ligne officiel.","k":"cours","a":1,"m":"","b":null,"p":"Vous pouvez tester vos programmes sans carte physique grâce au simulateur intégré à l'éditeur officiel Micro:bit.","h":["Ouvrir le simulateur","Premier test","Fonctionnalités du simulateur","Exemple avec interaction","Dépannage"]},{"s":"tp_microbit","t":"TP - Micro:bit","d":"S'initier à la programmation embarquée avec la carte Micro:bit","k":"tp","a":1,"m":"","b":null,"p":"La carte Micro:bit est un petit ordinateur de poche programmable. Elle permet de découvrir l'informatique embarquée de manière ludique.","h":["Présentation","Premiers pas en Python","Exercices"]}]},{"n":"Programmation Python","img":"chapitres/1/chap_python.png","list":[{"s":"Fiche_exercices_boucles","t":"Fiche d'exercices : Les boucles en Python","d":"Exercices sur les boucles (for/while) en Python.","k":"exercices","a":1,"m":"","b":null,"p":"","h":[]},{"s":"Fiche_exercices_conditions","t":"Fiche d'exercices : Les conditions en Python","d":"Exercices sur les conditions (if/else) en Python.","k":"exercices","a":1,"m":"","b":null,"p":"","h":[]},{"s":"Fiche_exercices_python","t":"Fiche d'exercices : Python","d":"Premiers pas avec Python : variables, input/output, et calculs simples.","k":"exercices","a":1,"m":"","b":null,"p":"","h":[]}]},{"n":"Réseaux sociaux","img":"chapitres/1/chap_rsx_sociaux.png","list":[{"s":"activite_reseaux_sociaux_interactive","t":"Atelier Réseaux Sociaux : Graphe","d":"Visualiser les liens entre les utilisateurs d'un réseau social.","k":"tp","a":1,"m":"","b":null,"p":"Un réseau social peut être modélisé par un graphe : - Les nœuds (cercles) sont les utilisateurs. - Les arêtes (lignes) sont les liens d'amitié.","h":["🎯 Visualisation"]},{"s":"Cours_Reseaux_Sociaux","t":"Les Réseaux Sociaux : Définitions et Enjeux","d":"Comprendre les réseaux sociaux, leur modèle économique, les enjeux de cyberviolence et leur modélisation par les graphes.","k":"cours","a":1,"m":"","b":null,"p":"Un réseau social numérique n'est pas « Internet », ni « le Web » en général. C'est une plateforme précise, avec un profil, des relations, et un fil de contenus. On va d'abord la définir, puis regarder comment elle gagne de l'argent, ce qu'elle choisit de vous montrer, et comment on peut la dessiner comme un graphe.","h":["Ils ne montrent pas la même chose","Une histoire courte, et un modèle économique","L'algorithme ne vous montre pas tout","L'âge, le profil, et ce qu'on y met","Les violences qui passent par l'écran","Dessiner le réseau : les graphes","Six poignées de main"]},{"s":"tp_python_reseaux_sociaux","t":"TP Python : Réseaux sociaux","d":"Modéliser un réseau d'amis avec networkx (graphes) et pandas.","k":"tp","a":1,"m":"","b":null,"p":"","h":[]}]}],"1nsi":[{"n":"Algorithmique","img":"chapitres/2/chap_algo.png","list":[{"s":"algo_knn_cours","t":"Algorithme des K Plus Proches Voisins","d":"Comprendre l'algorithme KNN, son fonctionnement, la distance euclidienne et ses applications en classification et régression.","k":"cours","a":1,"m":"","b":null,"p":"Pour deviner ce qu'est un nouvel exemple, on regarde ceux qu'on connaît déjà et qui lui ressemblent. C'est tout l'algorithme des plus proches voisins, le k-NN. Il n'apprend pas une formule. Il garde les exemples, mesure des distances, et suit les voisins. La proximité, ici, tient lieu de similarité.","h":["Quatre gestes","La distance euclidienne","Choisir k","Ce que l'algorithme coûte","Pour s'entraîner"]},{"s":"algo_gloutons","t":"Algorithmes Gloutons","d":"Introduction aux stratégies d'optimisation gloutonnes (Rendu de monnaie, Sac à dos)","k":"cours","a":1,"m":"","b":null,"p":"Un algorithme glouton prend, à chaque étape, le choix qui paraît le meilleur maintenant, et il ne revient pas dessus. Il est simple à écrire et souvent rapide. Il ne garantit pas la meilleure solution globale. Un alpiniste qui grimpe toujours la pente la plus raide devant lui atteint un sommet. Rien ne dit que…","h":["Rendre la monnaie","Remplir un sac","Choisir des tâches qui ne se chevauchent pas","Pour s'entraîner"]},{"s":"activite_algo_interactive","t":"Atelier Algo : La Course au Tri","d":"Visualiser comment un algorithme trie des données.","k":"tp","a":1,"m":"","b":null,"p":"Trier des données est l'une des tâches les plus courantes en informatique. Mais comment l'ordinateur s'y prend-il ?","h":["🎯 Observation","🧠 Analyse"]},{"s":"algo_tris_exercices_fusion","t":"Exercices : Tri et Fusion","d":"Cours sur Exercices : Tri et Fusion","k":"exercices","a":1,"m":"","b":null,"p":"","h":[]},{"s":"algo_knn_exercices","t":"Exercices KNN","d":"Exercices pratiques sur l'algorithme des K Plus Proches Voisins (calculs manuels, implémentation Python, analyse).","k":"exercices","a":1,"m":"","b":null,"p":"??? success \"Correction\" 1. Distances au carré () :","h":["Exercice 1 : Compréhension du principe","Exercice 2 : Calcul de distance euclidienne","Exercice 3 : Application manuelle (K=1 et K=3)","Exercice 4 : Influence de K","Exercice 5 : Implémentation de la distance","Exercice 6 : Recherche des voisins","Exercice 7 : Prédiction de classe (Vote majoritaire)","Exercice 8 : Système de recommandation de films","Exercice 9 : Optimisations et variantes (Approfondissement)"]},{"s":"algo_dichotomie","t":"Recherche Dichotomique","d":"Algorithme de recherche efficace dans une liste triée","k":"cours","a":1,"m":"","b":null,"p":"Chercher un mot dans un dictionnaire en lisant chaque page depuis le début marche, et c'est lent. On ouvre au milieu, on regarde si le mot est avant ou après, et on jette une moitié. La recherche dichotomique fait exactement cela sur une liste triée. À chaque comparaison, la zone qui reste est environ deux fois…","h":["Deux bornes qui se resserrent","Pseudocode","Solution Python","Pourquoi c'est rapide","Pour s'entraîner"]},{"s":"algo_tris","t":"TP : Algorithmes de Tri","d":"Comprendre et implémenter les tris par sélection et insertion","k":"tp","a":1,"m":"Durée : 2 heures · Objectif : Implémenter les algorithmes classiques","b":"premiere_tris","p":"Trier, c'est réorganiser une liste pour que les éléments soient dans un ordre (croissant ou décroissant). Sélection et insertion procèdent par comparaisons ; le dénombrement compte les occurrences.","h":["Objectifs","Idée clé","Le Tri par Sélection","Le Tri par Insertion","Pour aller plus loin : Le Tri par Dénombrement","Bonus : Visualisation et Comparaison","Piège fréquent","À retenir","Pour s'entraîner"]},{"s":"algo_knn","t":"TP KNN","d":"Travaux pratiques pour implémenter l'algorithme KNN sur des cas concrets (Fruits, Iris, Spam).","k":"tp","a":1,"m":"","b":null,"p":"L'objectif de ce TP est de mettre en pratique l'algorithme des K Plus Proches Voisins (KNN) sur de petits ensembles de données, en partant de zéro.","h":["Objectif","Exercice 1 : Douceur d'un fruit","Exercice 2 : Classification de fleurs Iris (simplifié)","Exercice 3 : Détection de spam (conceptuel)"]}]},{"n":"Introduction à Python","img":"chapitres/2/chap_python.png","list":[{"s":"python_constructions_elementaires","t":"Constructions élémentaires en Python","d":"Variables, opérateurs, entrées-sorties, conditions et boucles : les briques de base d'un programme.","k":"cours","a":1,"m":"","b":null,"p":"Un programme Python est une suite d'instructions exécutées dans l'ordre, de haut en bas, sauf quand un test ou une boucle décide de sauter ou de recommencer. Les briques de cette suite sont peu nombreuses : affecter une valeur, calculer, lire, afficher, choisir, répéter. Tout le reste de l'année s'appuie dessus.","h":["L'affectation","Calculer","Choisir un chemin","Lire et afficher","Répéter","Pour s'entraîner"]},{"s":"python_exercices_boucles","t":"Exercices : Les Boucles","d":"for, while, range et parcours de chaînes — fiche progressive par niveau.","k":"exercices","a":1,"m":"for, while, range et parcours de chaînes","b":null,"p":"","h":[]},{"s":"python_exercices_conditions","t":"Exercices : Les Conditions","d":"","k":"exercices","a":1,"m":"if, if/else, if/elif/else et opérateurs logiques","b":null,"p":"","h":[]},{"s":"python_exercices_fonctions","t":"Exercices : Les Fonctions","d":"","k":"exercices","a":1,"m":"Définition, Paramètres et Valeurs de retour","b":"les-fonctions-python","p":"","h":[]},{"s":"python_exercices_specifications","t":"Exercices : Spécification","d":"","k":"exercices","a":1,"m":"Docstrings, Type Hinting et Documentation","b":"specifications-python","p":"Avant de passer aux exercices de spécification, entraînez-vous à repérer les erreurs courantes de nommage, de typage et de logique qui rendent le code difficile à spécifier ou à maintenir.","h":["🐞 Chasseur de Bugs","Le contrat de confiance : l'Assertion"]},{"s":"python_exercices_types","t":"Exercices : Types en Python","d":"","k":"exercices","a":1,"m":"Variables, Types, Opérateurs et Conditions","b":"types-python","p":"","h":[]},{"s":"python_fonctions","t":"Fonctions en Python","d":"Définir, appeler et documenter des fonctions pour modulariser un programme.","k":"cours","a":1,"m":"","b":null,"p":"Dès qu'un calcul revient deux fois, le copier-coller devient un piège : on corrige une copie et on oublie l'autre. Une fonction donne un nom à ce calcul. On lui passe des entrées, elle travaille, elle renvoie un résultat. Le reste du programme n'a pas besoin de voir les lignes du milieu. Il appelle le nom.","h":["Définir, puis appeler","Ce qui reste dans la fonction","Nommer et documenter","Pour s'entraîner"]},{"s":"python_types_base","t":"Types de données en Python","d":"Booléens, entiers, flottants et chaînes : reconnaître un type et l'utiliser correctement.","k":"cours","a":1,"m":"","b":null,"p":"Vous avez déjà écrit des affectations, des tests et des boucles. Chaque valeur que ces lignes manipulent a un type, et le type décide ce que Python accepte d'en faire. Comparer des booléens, calculer avec des nombres, indexer une chaîne : ce ne sont pas les mêmes opérations. La confusion la plus fréquente en début…","h":["Les booléens","Les nombres","Les chaînes","Vérifier un type","Pour s'entraîner"]}]},{"n":"Représentation des données","img":"chapitres/2/chap_types.png","list":[{"s":"donnees_booleens","t":"Booléens et Fonctions booléennes","d":"L'algèbre de George Boole et la logique binaire","k":"cours","a":1,"m":"","b":null,"p":"George Boole, au XIXe siècle, a voulu calculer avec des propositions vraies ou fausses, comme on calcule avec des nombres. Un siècle plus tard, les circuits ont fait de cette algèbre quelque chose de physique : un fil porte un signal, ou il n'en porte pas. En programmation, le même partage revient dans chaque if.…","h":["Quatre opérations","Calculer une expression","En Python","Pour s'entraîner"]},{"s":"donnees_entiers_relatifs","t":"Entiers négatifs en Binaire","d":"Représentation des nombres signés et complément à 2","k":"cours","a":1,"m":"","b":null,"p":"Les entiers positifs tiennent dans des puissances de 2. Une température, un score, une coordonnée descendent aussi en dessous de zéro. Il faut donc coder des entiers signés, et d'abord fixer la taille : 4 bits, 8 bits, 32 bits. Le domaine représentable dépend de ce choix. Sur 8 bits, le codage qu'utilisent les…","h":["Le bit de signe ne suffit pas","Le complément à deux","Pour s'entraîner"]},{"s":"donnees_entiers_positifs","t":"Entiers Positifs en Binaire et Hexadécimal","d":"Comprendre les systèmes de numération et les conversions entre bases","k":"cours","a":1,"m":"","b":null,"p":"Une machine ne distingue que deux états : le courant passe, ou il ne passe pas. On code donc les entiers avec deux symboles, 0 et 1. Le binaire est cette écriture. L'hexadécimal, seize symboles, sert surtout à la raccourcir : un chiffre hexadécimal remplace exactement quatre bits. Avant de convertir, il faut voir…","h":["Une base, des colonnes","Du binaire vers le décimal","Du décimal vers le binaire","L'hexadécimal, quatre bits d'un coup","Pour s'entraîner"]},{"s":"donnees_binaires_exercices","t":"Exercices Binaire et Hexadécimal","d":"Exercices sur la représentation des nombres en binaire et hexadécimal, opérations arithmétiques et complément à deux.","k":"exercices","a":1,"m":"","b":"premiere_fiche_exercices_binaires","p":"Cette fiche couvre les conversions entre bases, les opérations arithmétiques binaires, le complément à deux et l'implémentation de conversions en Python.","h":[]},{"s":"donnees_booleens_exercices","t":"Exercices Booléens","d":"Exercices sur les booléens, les opérateurs de comparaison et les opérateurs logiques en Python.","k":"exercices","a":1,"m":"","b":"premiere_fiche_exercices_bool","p":"Cette fiche propose une série d'exercices progressifs pour maîtriser les booléens et les opérations logiques en Python.","h":[]},{"s":"donnees_reels","t":"Nombres réels en Binaire","d":"Représentation en virgule fixe et flottante (IEEE754)","k":"cours","a":1,"m":"","b":null,"p":"Un entier tombe juste sur un nombre fini de bits. Un réel, souvent non. On le code comme une notation scientifique, mais en base 2 :","h":["Après la virgule","IEEE 754, simple précision","Ce que Python affiche vraiment","Pour s'entraîner"]},{"s":"donnees_caracteres","t":"Représentation des caractères","d":"Codage ASCII et Unicode (UTF-8)","k":"cours","a":1,"m":"","b":null,"p":"La machine ne stocke que des bits. Une lettre n'est donc pas un dessin : c'est un nombre, qu'on affiche ensuite comme un glyphe. « A », « é », « 字 » sont trois symboles, et chacun a un code. Le système de règles qui relie le nombre au symbole s'appelle un codage.","h":["Un caractère est un entier","ASCII, cent vingt-huit places","Unicode nomme, UTF-8 range","Pour s'entraîner"]}]},{"n":"Dictionnaires et Tables","img":"chapitres/2/chap_dictio.png","list":[{"s":"bdd_sql_introduction","t":"Bases de données et SQL","d":"Introduction aux bases de données relationnelles et au langage de requête SQL","k":"cours","a":1,"m":"","b":null,"p":"Un tableur ou un fichier CSV finit par suffire tant que vous êtes seul à le modifier, et tant que la question reste simple. Dès que plusieurs programmes doivent lire les mêmes informations, les mettre à jour sans les casser, et n'en extraire qu'une partie, on passe à une base de données. En 1970, Edgar F. Codd…","h":["Demander, pas parcourir","Pratiquer"]},{"s":"python_dictionnaires","t":"Dictionnaires en Python","d":"Structure clé-valeur : créer, lire, modifier et parcourir un dictionnaire.","k":"cours","a":1,"m":"","b":null,"p":"Une liste se lit par un indice : notes[0] est la première note, et l'ordre compte. Un dictionnaire se lit par une clé : eleve[\"prenom\"] nomme l'information qu'on veut. La clé désigne, la valeur contient. On ne dit pas « attribut » ici. Ce mot appartient à la programmation orientée objet. Ici, on parle de clés.","h":["Créer","Lire, modifier, retirer","Parcourir","Pour s'entraîner"]},{"s":"python_exercices_dictionnaires","t":"Exercices : Dictionnaires","d":"Création, accès, modification et parcours des dictionnaires — fiche progressive par niveau.","k":"exercices","a":1,"m":"Dictionnaires Python : clés, valeurs, parcours et dictionnaires imbriqués","b":null,"p":"","h":[]},{"s":"python_csv_exercices","t":"Exercices : Traitement CSV","d":"Cours sur Exercices : Traitement CSV","k":"exercices","a":1,"m":"","b":null,"p":"","h":[]},{"s":"python_structures_imbriquees","t":"TP - Structures Imbriquées (Spotify)","d":"Manipuler des listes de dictionnaires contenant des listes","k":"tp","a":1,"m":"","b":null,"p":"C'est exactement comme cela que Spotify ou Netflix stockent vos données !","h":["🎯 Objectif","Analyse de la Structure","Exercices d'Échauffement (Lecture)","Exercices Avancés (Listes dans Dictionnaires)","Défis Experts (Calculs & Filtrage)","Défis Ultimes (Data Analyst) 👩‍💻"]},{"s":"python_csv","t":"Traitement de données en tables","d":"Charger un CSV en liste de dictionnaires, puis projeter et sélectionner des données.","k":"cours","a":1,"m":"","b":null,"p":"Un tableur et un fichier texte racontent souvent la même chose : des lignes, des colonnes, un en-tête. Le format CSV (*Comma-Separated Values*) est ce texte. Chaque ligne est un enregistrement, les champs sont séparés par une virgule ou, très souvent en France, par un point-virgule. Une fois chargé, le fichier…","h":["Charger le fichier","Choisir des colonnes : la projection","Choisir des lignes : la sélection","Atelier interactif","Pour s'entraîner"]}]},{"n":"Web et Interaction","img":"chapitres/2/chap_web.png","list":[{"s":"web_css_introduction","t":"Introduction au CSS","d":"Mise en forme des pages web — sélecteurs, couleurs et mise en page de base.","k":"cours","a":1,"m":"","b":null,"p":"Le HTML a posé les titres, les paragraphes et les zones. Il ne décide pas de la couleur, de la police, ni de l'alignement. C'est le rôle du CSS (*Cascading Style Sheets*) : la présentation. On sépare les deux pour pouvoir changer l'apparence sans réécrire le contenu, et pour que la même feuille habille plusieurs pages.","h":["Relier la feuille à la page","Qui est visé","Ce qu'on règle le plus souvent","Aligner avec Flexbox","Pour s'entraîner / Suite"]},{"s":"web_http_exercices","t":"Fiche d'exercices - Web et HTTP","d":"Exercices sur le protocole HTTP, les URLs, le HTML, le CSS et JavaScript.","k":"exercices","a":1,"m":"","b":null,"p":"https://www.example.com:8080/path/to/page?param1=value1&param2=value2#section","h":["Partie 1 : Protocole HTTP et URLs","Partie 2 : HTML et CSS","Partie 3 : JavaScript et interactivité"]},{"s":"algo_galerie_art","t":"Galerie d'images en HTML","d":"Mini-activité pour intégrer des images dans une page HTML (balise img, alt, chemins) — ressource liée au chapitre Web.","k":"tp","a":1,"m":"","b":null,"p":"Une image web n'est pas « collée » dans le fichier HTML : on pointe vers un fichier (chemin) et on fournit un texte alternatif pour l'accessibilité.","h":["Objectifs","Idée clé","La balise img","Chemins : relative vs absolue","Galerie minimale","Aperçu des images de démonstration","Piège fréquent","À retenir","Pour s'entraîner"]},{"s":"web_javascript_interactions","t":"Interactions Web : JavaScript","d":"Rendre les pages web dynamiques et interactives avec le DOM et les événements.","k":"cours","a":1,"m":"","b":"js_interactions","p":"Le HTML a décrit la page, le CSS l'a habillée. Rien ne se passe encore quand on clique. Le JavaScript est le troisième langage : il s'exécute dans le navigateur et change la page pendant qu'on la regarde. Brendan Eich l'a créé en 1995. Il est aujourd'hui le langage du comportement, côté client.","h":["Une syntaxe courte","Trouver un nœud, puis le changer","Réagir à un geste","Pour s'entraîner / Suite","Exercices pratiques"]},{"s":"web_html","t":"Le langage HTML","d":"Introduction au langage HTML, structure d'une page et principales balises.","k":"cours","a":1,"m":"","b":null,"p":"Une page web n'est pas un dessin. C'est un texte balisé, que le navigateur interprète. Le HTML (*HyperText Markup Language*) décrit la structure et le sens du contenu : ceci est un titre, ceci un paragraphe, ceci un lien. Il ne dit pas la couleur, et il ne réagit pas au clic. La couleur viendra du CSS, le clic du…","h":["Le squelette d'un document","Des balises qui veulent dire quelque chose","Un formulaire envoie des données","Pour s'entraîner / Suite"]},{"s":"web_protocoles","t":"Le Web et HTTP","d":"Introduction au Web, architecture client-serveur, protocole HTTP et URL.","k":"cours","a":1,"m":"","b":null,"p":"Vous avez écrit des pages. Il reste à voir comment elles voyagent. Le Web est une application : un navigateur, le client, demande une ressource à un serveur, qui répond. Le protocole de cet échange s'appelle HTTP, ou HTTPS quand l'échange est chiffré. Une URL nomme la ressource. Le DNS traduit le nom de domaine en…","h":["Lire une URL","La requête et la réponse","HTTPS, pages, cookies","Pour s'entraîner / Suite"]}]},{"n":"Structures de données linéaires","img":null,"list":[{"s":"python_exercices_listes","t":"Exercices : Les listes","d":"Création, parcours, modification et algorithmes sur les listes — fiche progressive par niveau.","k":"exercices","a":1,"m":"Listes Python : indices, parcours, méthodes et algorithmes","b":null,"p":"","h":[]},{"s":"python_exercices_papier","t":"Exercices : Listes et tuples","d":"Fiche d'exercices papier sur les listes et tuples","k":"exercices","a":1,"m":"","b":null,"p":"","h":[]},{"s":"structures_lineaires_piles_files","t":"Piles et Files","d":"Piles (LIFO) et files (FIFO) : principe, opérations, et implantation avec des listes.","k":"cours","a":1,"m":"","b":null,"p":"Une liste Python laisse lire, insérer et retirer à peu près n'importe quelle place. C'est pratique, et parfois trop. Une pile et une file sont des listes dont on a volontairement restreint les opérations, pour qu'une règle d'accès reste vraie du début à la fin de l'algorithme. Sur une pile, on ne touche que le…","h":["La pile : dernier entré, premier sorti","La file : premier entré, premier sorti","Une liste, à condition de se tenir","Pour s'entraîner"]},{"s":"structures_lineaires_cours","t":"Structures de données linéaires","d":"Listes et tuples : accès par indice, parcours, et modifications des listes.","k":"cours","a":1,"m":"","b":null,"p":"Une structure linéaire range des éléments les uns après les autres. Chaque case a un indice, et l'ordre fait partie de l'information. En Python, deux structures partagent cette idée et ne partagent pas les mêmes droits. Le tuple fige son contenu. La liste le laisse changer. On choisit l'une ou l'autre selon qu'on a…","h":["L'indice commence à zéro","Modifier une liste","Construire une liste en une expression","Pour s'entraîner"]},{"s":"structures_lineaires_tp","t":"TP Piles et Files","d":"Implémentation de Piles et Files et applications (parenthésage, file d'attente).","k":"tp","a":1,"m":"","b":null,"p":"Implémenter les structures de données Pile et File en POO et les utiliser pour résoudre des problèmes classiques.","h":["Objectif","Partie 1 : Implémentation","Partie 2 : Application des Piles - Vérification de parenthèses","Partie 3 : Application des Files - Simulation"]}]},{"n":"Architecture matérielle","img":"chapitres/2/chap_archi.png","list":[{"s":"archi_circuits","t":"Circuits électroniques","d":"Portes logiques, transistors et tables de vérité","k":"cours","a":1,"m":"","b":null,"p":"Le cours sur les booléens a calculé avec vrai et faux. Le processeur fait le même calcul avec des tensions. Un transistor est un interrupteur commandé : une tension sur la grille laisse passer le courant, ou le bloque. En assemblant quelques transistors, on obtient une porte logique, qui réalise ET, OU ou NON sur…","h":["Quatre portes","Lire une équation","Une alarme, pour voir la table devenir un montage","Pour s'entraîner"]},{"s":"archi_circuits_exercices","t":"Exercices : Circuits Logiques","d":"Cours sur Exercices : Circuits Logiques","k":"exercices","a":1,"m":"","b":null,"p":"","h":[]},{"s":"archi_von_neumann","t":"Modèle de Von Neumann","d":"Comprendre les fondements de l'architecture informatique moderne et le modèle séquentiel","k":"cours","a":1,"m":"","b":null,"p":"Ouvrez un ordinateur, même en pensée : il y a un processeur, de la mémoire, des câbles, un clavier, un écran. Le modèle de von Neumann est la façon de nommer ces blocs, et surtout de dire dans quel ordre ils travaillent. Un ordinateur moderne exécute un programme stocké en mémoire, données et instructions au même…","h":["Dans le processeur","Plusieurs mémoires, pas une","Le tuyau le plus étroit","Pour s'entraîner"]}]},{"n":"Programmation Orientée Objet","img":"chapitres/2/chap_poo.png","list":[{"s":"poo_exercices","t":"Exercices POO","d":"Exercices pratiques sur la POO. Création de classes, méthodes, héritage et encapsultation.","k":"exercices","a":1,"m":"","b":null,"p":"Nous reprenons la classe Voiture du cours.","h":["TP Guidé : Concessionnaire Automobile","Exercices d'application (Niveau Facile)","Exercices d'application (Niveau Intermédiaire)"]},{"s":"poo_introduction","t":"Introduction POO","d":"Classes, objets, attributs et méthodes : premiers pas en programmation orientée objet.","k":"cours","a":1,"m":"","b":null,"p":"Jusqu'ici, une donnée d'un côté et une fonction de l'autre vivaient séparées. On passait la donnée à la fonction quand on en avait besoin. En programmation orientée objet, on change de geste : ce qu'une chose *est* et ce qu'elle *sait faire* voyagent ensemble. Aujourd'hui, on apprend à écrire ce regroupement, et à…","h":["La classe décrit, l'objet existe","Créer, puis s'en servir","Pourquoi se donner cette peine","Deux erreurs qui reviennent","Pour s'entraîner"]}]},{"n":"Systèmes d'exploitation","img":"chapitres/2/chap_sys.png","list":[{"s":"os_linux_commandes","t":"Commandes Linux","d":"Guide des commandes essentielles pour naviguer et gérer un système Linux.","k":"cours","a":1,"m":"","b":null,"p":"Le cours sur les systèmes a décrit l'arborescence. Ici, on s'y déplace. Le shell est le programme qui lit une ligne, la découpe en commande, options et chemins, et lance le programme correspondant. Une option s'écrit souvent avec un tiret : -l, -a, -r. Tout chemin absolu part de la racine /. Un chemin relatif part…","h":["Savoir où l'on est","Créer, copier, déplacer, effacer","Les droits, en trois chiffres","Se connecter plus loin"]},{"s":"os_systemes","t":"Systèmes d'Exploitation","d":"Introduction aux systèmes d'exploitation (OS), leur histoire, composants et fonctionnement.","k":"cours","a":1,"m":"","b":null,"p":"Vous avez vu le processeur, la mémoire et les bus. Aucun programme que vous écrivez ne leur parle directement. Entre votre code et le matériel, il y a un système d'exploitation. Sans lui, chaque application devrait savoir allumer un pixel, réserver une case mémoire et attraper une touche du clavier. L'OS fait ce…","h":["Le noyau","Où sont les fichiers","Qui a le droit","Deux façons de commander","Pour s'entraîner"]}]},{"n":"Histoire","img":null,"list":[{"s":"histoire_informatique","t":"Histoire de l'Informatique","d":"Les grandes étapes, figures et machines qui ont façonné le monde numérique.","k":"cours","a":1,"m":"","b":null,"p":"L'informatique ne commence pas avec le PC de la maison. Elle commence quand on essaie de faire calculer une machine, puis quand on sépare l'idée du calcul de la quincaillerie qui le réalise. Les concepts, l'algorithme, le programme stocké, le réseau, arrivent souvent avant les appareils que le public peut acheter.…","h":["Avant l'électronique","La guerre, puis une architecture","Du tube à la puce","Quand tout le monde peut s'en servir","Frise","Pour s'entraîner"]}]},{"n":"Réseaux et Internet","img":"chapitres/2/chap_res.png","list":[{"s":"reseaux_cours","t":"Introduction aux réseaux","d":"Comprendre les fondements de la communication numérique, le modèle TCP/IP et l'adressage","k":"cours","a":1,"m":"","b":null,"p":"En Seconde, vous avez vu un réseau comme un ensemble de machines reliées. En Première, on met des noms précis sur ce qui circule, et on sépare des mots que le langage courant mélange. Une machine a besoin d'une identité locale, l'adresse MAC, et d'une adresse logique, l'adresse IP. Les données partent en paquets.…","h":["Deux adresses, deux échelles","Masque et notation CIDR","Privée ou publique","Quatre couches, et des enveloppes","Pour s'entraîner"]}]},{"n":"Projets","img":null,"list":[{"s":"projet_systeme_vote","t":"Algorithmes : Système de Vote","d":"Implémentation de différents systèmes de scrutin (Majoritaire, Condorcet)","k":"projet","a":1,"m":"","b":null,"p":"Le but de ce projet est de programmer un système de dépouillement. Dans ce projet, nous allons appliquer quatre règles au même jeu de bulletins, et constater que la règle peut changer le vainqueur.","h":["Scrutin à un tour 🗳️","Scrutin à deux tours 2️⃣","Condorcet ⚔️","Borda et comparaison 🧮","Pour aller plus loin"]},{"s":"projet_simulation_propagation","t":"Boucles : Simulation de Propagation","d":"Modéliser la propagation d'une rumeur ou d'un virus dans une population.","k":"projet","a":1,"m":"","b":"premiere_projet_virus","p":"Le but de ce projet est de simuler, jour après jour, la propagation d'une rumeur dans une population fermée. Dans ce projet, nous allons écrire une boucle while qui s'arrête quand tout le monde est au courant, sans jamais dépasser la population.","h":["Le modèle 📣","Pour aller plus loin"]},{"s":"projet_application_bancaire","t":"Dictionnaires : App Bancaire","d":"Création d'une application bancaire simple en Python","k":"projet","a":1,"m":"","b":null,"p":"Le but de ce projet est de créer une petite banque en console, en Python. Dans ce projet, nous allons ranger les comptes dans un dictionnaire, puis écrire le dépôt, le retrait, la consultation et le menu.","h":["Les comptes 💳","Dépôt et retrait 💶","Le menu 🏧","Simulation et rendu 🧪","Pour aller plus loin"]},{"s":"projet_jeux_video","t":"Dictionnaires : Collection Jeux","d":"Création d'un gestionnaire de collection de jeux vidéo en Python","k":"projet","a":1,"m":"","b":null,"p":"Le but de ce projet est de créer un gestionnaire de collection de jeux vidéo, en Python. Dans ce projet, nous allons ajouter un jeu, afficher sa fiche, modifier un champ, supprimer un jeu, puis lister toute la collection depuis un menu.","h":["La collection 🕹️","Ajouter et chercher 🔍","Modifier et supprimer ✏️","Menu et rendu 📋","Pour aller plus loin"]},{"s":"poo_projet_pokensi","t":"Dictionnaires : PokéNSI","d":"Création d'un jeu inspiré de Pokémon en Python","k":"projet","a":1,"m":"","b":null,"p":"Le but de ce projet est de créer un jeu inspiré de Pokémon en utilisant Python. Dans cette première partie, nous allons nous concentrer sur la création du Pokédex et la mise en place du système de combat.","h":["Le Pokédex 📱","Le système de combat ⚔️","Simulation ⚡"]},{"s":"projet_caisse_foyer","t":"Fonctions : La caisse du foyer","d":"Tenir la caisse du foyer avec des fonctions, des conditions et des boucles, sans liste ni dictionnaire.","k":"projet","a":1,"m":"","b":null,"p":"Le but de ce projet est de tenir la caisse du foyer du lycée pendant la récréation. Dans ce projet, nous allons servir les clients un par un, encaisser, rendre la monnaie, puis afficher le bilan. Le foyer vend trois articles.","h":["Contraintes de programmation","Les trois articles 🥤","Une ligne de ticket 💶","Un client 🙋","La récréation 🔄","Le bilan 📊"]},{"s":"projet_tournoi_esport","t":"Listes : Tournoi E-Sport","d":"Gérer les scores et le classement d'un tournoi de jeu vidéo.","k":"projet","a":1,"m":"","b":"premiere_projet_esport","p":"Le but de ce projet est de créer l'outil d'une soirée tournoi (League of Legends, Rocket League, Valorant, ou un jeu du lycée). Dans ce projet, nous allons inscrire les équipes, saisir un score par équipe, calculer la moyenne, désigner le ou les vainqueurs, puis afficher le classement.","h":["Les équipes 👥","Simulation 📺","Pour aller plus loin"]},{"s":"projet_gestion_bibliotheque","t":"Structures : Bibliothèque","d":"Système de gestion d'une collection de livres numériques en Python","k":"projet","a":1,"m":"","b":null,"p":"Le but de ce projet est de créer un programme qui gère une collection de livres : ajout, recherche, affichage, suppression, et conservation des données dans un fichier CSV entre deux lancements. Dans ce projet, chaque livre est un dictionnaire, et la bibliothèque est une liste de ces dictionnaires.","h":["Les livres 📖","Le fichier CSV 💾","Menu et suppression 🗑️"]},{"s":"projet_gestion_stock","t":"Structures : Gestion Stock","d":"Simulation d'un système de gestion de stock et de ventes pour un petit commerce","k":"projet","a":1,"m":"","b":null,"p":"Le but de ce projet est de simuler la réserve et la caisse d'un petit commerce. Dans ce projet, le catalogue est une liste de dictionnaires, et une vente est une liste de couples (id_produit, quantite). On ne retire du stock qu'une fois toute la vente vérifiée : un article manquant annule le ticket entier.","h":["Le catalogue 🏷️","Les mouvements 📥","La vente 🧾","Menu et rendu 🛒"]},{"s":"projet_empreinte_carbone","t":"Variables : Calculateur d'Empreinte Carbone","d":"Créer un outil pour estimer l'impact écologique d'un trajet.","k":"projet","a":1,"m":"","b":"premiere_projet_carbone","p":"Le but de ce projet est de créer un programme qui estime les émissions de CO2 d'un trajet selon le mode de transport. Dans ce projet, nous allons travailler les variables, input, les conversions de type et les conditions.","h":["Les facteurs 🚲"]},{"s":"web_projet","t":"Web : Site Personnel","d":"Créer une page web sur un tableau revisité avec des renards.","k":"projet","a":1,"m":"","b":null,"p":"Le but de ce projet est de créer une page web qui présente un tableau connu, puis une version de ce tableau où des renards ont pris la place des personnages. Dans ce projet, la page raconte une courte histoire à partir de cette scène, et le visiteur bascule entre les deux images.","h":["Le tableau et les fichiers 🖼️","Le bouton qui change l'image 🦊"]}]}],"tnsi":[{"n":"Langages et Programmation","img":"chapitres/3/chap_langages.png","list":[{"s":"prog_modularite_mise_au_point","t":"Modularité et Mise au Point","d":"Apprenez à structurer vos programmes, gérer les erreurs et valider votre code avec des tests.","k":"cours","a":1,"m":"","b":null,"p":"En Terminale, un programme qui « marche sur l'exemple du cours » ne suffit plus. Il doit rester lisible dans six mois, survivre à une entrée absurde, et pouvoir être vérifié sans le relire en entier. Trois outils portent ce travail : découper en modules, traiter les erreurs au lieu de les laisser planter, et écrire…","h":["Découper en modules","Trois sortes d'erreurs","Dire ce que la fonction exige","Des tests qui rejouent les exemples"]},{"s":"listes-comprehension-exercices","t":"Listes par compréhension - Exercices","d":"Série d'exercices gradués pour maîtriser les listes par compréhension en Python.","k":"exercices","a":1,"m":"","b":null,"p":"Les listes par compréhension sont un moyen concis et puissant de créer des listes en Python. Elles remplacent souvent les boucles for classiques pour la construction de listes.","h":[]},{"s":"prog_recursivite","t":"Récursivité","d":"Principe des fonctions récursives et pile d'exécution.","k":"cours","a":1,"m":"","b":"terminale_recursivite","p":"Une fonction est récursive lorsqu'elle s'appelle elle-même. On s'en sert quand un problème se décompose en un problème de la même forme, plus petit. La factorielle, le parcours d'un arbre, les tours de Hanoï : à chaque fois, la question sur se ramène à la même question sur , ou sur une partie de la structure. Sans…","h":["Deux morceaux, pas un","La pile d'appels","Récursif et itératif"]},{"s":"prog_calculabilite","t":"Calculabilité et Décidabilité","d":"Limites de l'informatique : ce qui peut être calculé ou non.","k":"cours","a":1,"m":"","b":"terminale_calculabilite","p":"On a parfois l'impression qu'un ordinateur assez puissant finira par répondre à n'importe quelle question, pourvu qu'on lui laisse du temps. Alan Turing, en 1936, montre que non. Il existe des problèmes pour lesquels aucun algorithme ne donnera la réponse. Ce n'est pas une question de mémoire ou de vitesse. C'est…","h":["Une machine très pauvre, et pourtant suffisante","Calculable, décidable","Le problème de l'arrêt"]},{"s":"poo_heritage_polymorphisme","t":"POO : Héritage et polymorphisme","d":"Réutiliser et spécialiser des classes avec héritage, surcharge et redéfinition.","k":"cours","a":1,"m":"","b":null,"p":"Une classe décrit un moule. Quand plusieurs moules partagent les mêmes attributs et presque les mêmes méthodes, on n'écrit pas trois fois init. L'héritage crée une classe fille à partir d'une classe mère. La fille réutilise ce qui est commun, et spécialise ce qui change. On ne le fait que pour une relation « est un…","h":["La fille reprend, puis elle redéfinit","Appeler le constructeur de la mère"]},{"s":"exercices_poo","t":"Exercices : POO en Python","d":"Classes, encapsulation, composition et héritage en Python.","k":"exercices","a":1,"m":"","b":null,"p":"Ces exercices reprennent la progression du cours : une classe, l'encapsulation, plusieurs classes qui collaborent, puis l'héritage. Les cours utiles sont Classes et objets et Héritage et polymorphisme.","h":["Compte bancaire","Bibliothèque","Étudiants et moyenne","Concessionnaire","Import CSV","Refuge et héritage","Véhicules et héritage"]},{"s":"prog_api_evenementielle","t":"API et programmation événementielle","d":"Connecter interface utilisateur, événements et requêtes réseau","k":"cours","a":1,"m":"","b":null,"p":"Un programme de Première exécute ses lignes de haut en bas, puis s'arrête. Une application graphique attend. Elle ne sait pas quand la personne va cliquer, taper, ou quand la réponse du réseau va arriver. La programmation événementielle organise le code autour de ces moments. Une API est le contrat par lequel ce…","h":["Une API est un contrat, pas une page","L'interface réagit, elle ne boucle pas","Exercices"]}]},{"n":"Structures de données","img":"chapitres/3/chap_structures.png","list":[{"s":"poo_classes_objets","t":"POO : Classes et Objets","d":"Comprendre et appliquer la Programmation Orientée Objet en Python.","k":"cours","a":1,"m":"","b":"terminale_poo","p":"La programmation orientée objet organise un programme autour d'objets qui se parlent, plutôt qu'autour d'une longue suite de fonctions auxquelles on repasse les mêmes données. C'est le style dominant en Java, en C++, en C# et, pour une grande partie du code, en Python. L'idée n'est pas nouvelle pour vous si vous…","h":["Écrire la classe","Cacher le mécanisme"]},{"s":"structures_lineaires","t":"Structures Linéaires : Listes, Piles, Files","d":"Implémentation et utilisation des structures de données linéaires.","k":"cours","a":1,"m":"","b":"terminale_structures_lineaires","p":"Pour organiser les données, nous avons besoin de structures adaptées. En Terminale, nous étudions trois structures abstraites fondamentales : les Listes, les Piles et les Files.","h":["Les Listes Chaînées (Linked Lists)","Les Piles (Stacks)","Les Files (Queues)"]},{"s":"structures_arbres","t":"Arbres et Arbres Binaires","d":"Structures hiérarchiques, vocabulaire et algorithmes de base.","k":"cours","a":1,"m":"","b":"terminale_arbres","p":"Une liste range des éléments à la suite. Un arbre les range en niveaux : chaque élément a un parent, sauf un, et peut avoir des enfants. Les systèmes de fichiers, le DOM d'une page HTML, l'analyse d'une expression : ce sont des arbres. On ne parle plus d'indice « le troisième », on parle de qui descend de qui.","h":["Le vocabulaire","Au plus deux enfants","Visiter tous les nœuds"]},{"s":"arbres-binaires-recherche","t":"Arbres binaires de recherche et Algorithmes","d":"Révision ABR, implémentations et complexité","k":"cours","a":1,"m":"","b":null,"p":"Un arbre binaire range des nœuds avec un gauche et un droit. Un arbre binaire de recherche ajoute une règle sur les valeurs. Pour tout nœud, les valeurs du sous-arbre gauche sont strictement inférieures à la sienne, et les valeurs du sous-arbre droit sont supérieures ou égales. Les doublons, dans cette convention,…","h":["Chercher, insérer, et ce que ça coûte","Exercice 1 : Construction et propriétés","Exercice 2 : Implémentation Python","Exercice 3 : Applications avancées","Exercice 4 : Complexité et optimisation","Pour aller plus loin"]},{"s":"structures_graphes","t":"Graphes","d":"Modélisation de réseaux, sommets, arêtes et algorithmes.","k":"cours","a":1,"m":"","b":"terminale_graphes","p":"Un arbre a une racine, et un seul chemin entre deux nœuds. Beaucoup de situations refusent cette discipline. Deux villes sont reliées par plusieurs routes, deux comptes se suivent sans qu'il y ait de « sommet du réseau », une page web pointe vers une autre qui finit par revenir vers elle. On modélise cela par un…","h":["Ranger un graphe en mémoire","Parcourir sans tourner en rond"]},{"s":"graphes_ponderes_dijkstra","t":"Graphes pondérés et plus court chemin","d":"Comprendre et appliquer l'algorithme de Dijkstra","k":"cours","a":1,"m":"","b":null,"p":"Dans un graphe non pondéré, le plus court chemin est celui qui traverse le moins d'arêtes. Dès qu'une arête porte un poids — une distance, un coût, une durée — ce n'est plus le nombre d'arêtes qui compte, c'est la somme des poids. Un détour par trois arêtes légères peut être meilleur qu'une arête directe très…","h":["Valider le plus proche, puis relâcher","Le graphe en dictionnaire","Remonter le chemin","Exercices"]}]},{"n":"Algorithmique","img":"chapitres/3/chap_algo.png","list":[{"s":"algo_recherche_textuelle","t":"Algorithmes de Recherche Textuelle","d":"Recherche de motifs dans un texte : Naïf et Boyer-Moore.","k":"cours","a":1,"m":"","b":"terminale_algo_texte","p":"Le problème est celui de Ctrl+F ou de grep : trouver les occurrences d'un motif dans un texte. Le texte a une longueur , le motif une longueur . On veut les positions où les caractères du motif coïncident avec le texte. Tout l'enjeu est de ne pas tout recomparer à chaque décalage.","h":["Glisser d'un cran : la recherche naïve","Boyer-Moore : comparer par la fin"]},{"s":"algo_diviser_pour_regner","t":"Algorithmique : Diviser pour Régner","d":"Méthode de résolution par décomposition (Tri fusion, etc.).","k":"cours","a":1,"m":"","b":"terminale_diviser_regner","p":"Pour trier une liste, le tri fusion coupe la liste en deux moitiés. Il trie la moitié gauche par un appel récursif, puis la moitié droite. Une liste d'un seul élément, ou une liste vide, est déjà triée : c'est le cas de base, on ne coupe plus. Reste à fusionner deux listes triées en une seule liste triée.","h":["Le tri fusion","Tourner une image carrée","La dichotomie, presque"]},{"s":"algo_programmation_dynamique","t":"Programmation Dynamique","d":"Optimisation de problèmes complexes (Rendu de monnaie, Fibonacci).","k":"cours","a":1,"m":"","b":"terminale_prog_dynamique","p":"Diviser pour régner découpe un problème et résout les morceaux. Cela devient ruineux quand les morceaux se recoupent : on recalcule dix fois la même chose, par des chemins différents. La programmation dynamique fait le même découpage, et elle range le résultat de chaque sous-problème. La prochaine fois qu'on le…","h":["Fibonacci, calculé une fois","Le rendu de monnaie, quand le glouton se trompe"]},{"s":"algo_complexite_analyse","t":"Analyse de complexité","d":"Évaluer et comparer l'efficacité des algorithmes en temps et en mémoire","k":"cours","a":1,"m":"","b":null,"p":"Un algorithme peut être juste et néanmoins inutilisable. S'il examine chaque paire d'éléments d'une liste de dix millions d'entrées, la réponse correcte arrive trop tard. L'analyse de complexité prévoit comment le coût grandit quand la taille des données grandit. On s'en sert pour comparer des algorithmes sans…","h":["Le temps, compté en opérations","La mémoire","Comment conclure","Exercices"]}]},{"n":"Architectures matérielles, OS & Réseaux","img":"chapitres/3/chap_archi.png","list":[{"s":"archi_soc","t":"Architecture : SoC et Processus","d":"Architecture matérielle (SoC) et Système d'Exploitation (Processus).","k":"cours","a":1,"m":"","b":"terminale_archi_os","p":"L'architecture de von Neumann sépare le processeur, la mémoire et les entrées-sorties, reliés par des bus sur une carte mère. On peut changer la barrette de mémoire, ou la carte graphique. Un téléphone ne se démonte pas ainsi. Il repose sur un système sur puce, un *System on Chip*.","h":["Tout tenir sur une puce","Plusieurs programmes, peu de cœurs","Quand chacun attend l'autre"]},{"s":"reseaux_routage","t":"Réseaux : Protocoles de Routage","d":"Comment les paquets trouvent leur chemin sur Internet (RIP, OSPF).","k":"cours","a":1,"m":"","b":"terminale_routage","p":"Internet est un maillage de réseaux, reliés par des routeurs. Quand un paquet part, aucun routeur ne connaît le trajet complet jusqu'au destinataire. Chacun sait seulement à qui le passer ensuite. Les protocoles de routage servent à construire, et à tenir à jour, cette décision.","h":["La table de routage","RIP compte les sauts","OSPF regarde le débit"]},{"s":"securite_communications","t":"Sécurité des Communications","d":"Chiffrement symétrique, asymétrique et protocoles sécurisés.","k":"cours","a":1,"m":"","b":"terminale_securite","p":"Un paquet IP traverse des routeurs qui ne vous appartiennent pas. Quelqu'un placé sur le chemin peut le copier. On appelle cela une attaque de l'homme du milieu. Le chiffrement ne cache pas qu'une conversation a lieu, ni toujours vers qui. Il empêche de lire le contenu.","h":["Une seule clé","Une paire de clés","Ce que fait HTTPS"]},{"s":"os_ordonnancement_memoire","t":"Systèmes d'exploitation : ordonnancement et mémoire","d":"Approfondir processus, CPU, mémoire virtuelle et appels système","k":"cours","a":1,"m":"","b":null,"p":"En Première, le système d'exploitation était la couche entre vos programmes et le matériel. En Terminale, on regarde deux partages concrets : qui a le droit d'utiliser le processeur maintenant, et comment plusieurs programmes croient chacun disposer d'une mémoire continue alors qu'ils se la disputent.","h":["Processus et threads","À qui donner le processeur","Une mémoire qui n'est pas celle qu'on croit","Passer par le noyau","Exercices"]}]},{"n":"Bases de Données","img":"chapitres/3/chap_bdd.png","list":[{"s":"bdd_modele_relationnel","t":"Bases de Données : Modèle Relationnel","d":"Théorie des bases de données : tables, clés, schéma.","k":"cours","a":1,"m":"","b":"terminale_bdd_modele","p":"Une base de données stocke beaucoup d'informations, de façon structurée, durable, et exploitable par plusieurs programmes. Le modèle le plus répandu est le modèle relationnel, proposé par E. F. Codd en 1970. L'idée est de tout ranger dans des tables, et de lier les tables par des valeurs communes, pas par des…","h":["Tables, lignes, colonnes","Écrire le schéma","Ce que le SGBD refuse"]},{"s":"sql-bases-donnees","t":"SQL & Bases de Données","d":"Interroger et manipuler les données relationnelles","k":"cours","a":1,"m":"","b":null,"p":"Le modèle relationnel a posé les tables, les clés, les contraintes. SQL est le langage qui les crée, les remplit et les interroge. On ne parcourt pas la table avec une boucle dans le programme : on décrit le résultat voulu, et le SGBD décide comment le calculer.","h":["Créer, insérer, lire, modifier, supprimer","Comparer et combiner","Relier deux tables"]},{"s":"sql-bases-donnees-exercices","t":"SQL & Bases de Données - Exercices","d":"Exercices pratiques sur SQL et les bases de données","k":"exercices","a":1,"m":"","b":null,"p":"","h":[]}]},{"n":"Entrainement","img":"chapitres/3/chap_entrainement.png","list":[{"s":"exercices_terminale_fondamentaux","t":"Exercices fondamentaux - Terminale NSI","d":"Série d'exercices guidés sur les notions clés du programme","k":"exercices","a":1,"m":"","b":null,"p":"Cette fiche propose des exercices courts et progressifs pour consolider les notions de Terminale.","h":["Bloc A - Récursivité","Bloc B - ABR","Bloc C - Graphes","Bloc D - SQL","Bloc E - Complexité"]},{"s":"entrainement_epreuve_pratique","t":"Entraînement épreuve pratique","d":"Sujets chronométrés de type bac pratique NSI","k":"cours","a":1,"m":"","b":null,"p":"","h":["Format conseillé","Sujet type A - Récursivité","Sujet type B - ABR","Sujet type C - Graphes","Sujet type D - SQL + Python","Grille de compétences (épreuve pratique)","Auto-évaluation"]}]},{"n":"Histoire","img":"chapitres/3/chap_histoire.png","list":[{"s":"histoire_grands_evenements","t":"Histoire de l'Informatique","d":"Les grandes étapes, de l'Antiquité à l'IA moderne.","k":"cours","a":1,"m":"","b":"terminale_histoire","p":"L'informatique ne commence pas avec l'ordinateur de bureau. C'est la science du traitement automatique de l'information : représenter des données, écrire une procédure, la faire exécuter par une machine. Le boulier calcule déjà. Ce qui change, au fil des siècles, c'est ce que la machine sait enchaîner toute seule.","h":["Avant l'électricité","Une machine qui enchaîne les instructions","La puce, le Web, les données"]}]},{"n":"Projets","img":"chapitres/3/chap_projets.png","list":[{"s":"mini_projets_synthese","t":"Mini-projets de synthèse","d":"Mobiliser plusieurs notions du programme sur des projets courts","k":"cours","a":1,"m":"","b":null,"p":"Le but de ces quatre mini-projets est de réinvestir plusieurs chapitres du programme sur un travail de 2 à 6 heures. Chaque sujet ci-dessous se suit comme un projet : données de départ, fonctions à écrire, exemple chiffré, puis fichier à rendre.","h":["Réseau de villes 🛣️","Catalogue de véhicules 🚗","Analyse de logs 📜","Simulateur d'épreuve pratique 🎲","Ce qui est regardé sur les quatre sujets"]}]}],"sio":[{"n":"BTS SIO 1 : B2 - Développement (SLAM)","img":null,"list":[{"s":"csharp_csv_bdd","t":"C# et les Données : Fichiers CSV et Bases de Données","d":"Apprendre à persister des données en C# : du fichier CSV simple à la base de données MariaDB.","k":"cours","a":1,"m":"","b":null,"p":"Une liste de clients créée dans Main disparaît quand la console se ferme. Persister, c'est écrire ces données quelque part où elles survivent au programme, puis les relire au démarrage suivant. Deux endroits suffisent pour commencer. Le fichier CSV est un texte, simple, ouvrable dans Excel, adapté à un seul…","h":["Lire et écrire un CSV","Se connecter à MariaDB ou MySQL","Exercice"]},{"s":"introduction_poo","t":"Introduction à la POO en C#","d":"Les bases de la Programmation Orientée Objet : concepts, classes et objets.","k":"cours","a":1,"m":"","b":null,"p":"Jusqu'ici, un programme est une suite de fonctions qui se passent des variables. Cela tient pour un calcul. Cela se défait dès que le même « client » possède un nom, un solde, et trois opérations qui doivent rester cohérentes entre elles. La programmation orientée objet range ces données et ces opérations dans un…","h":["L'objet et la classe","Écrire la classe","Deux chiens, deux mémoires","Décider qui a le droit de modifier","Plusieurs façons de construire","Ce qu'une méthode rend","Trois piliers"]},{"s":"cours_heritage_csharp","t":"L'Héritage et le Polymorphisme en C#","d":"Approfondissement sur l'héritage, les classes abstraites et le polymorphisme.","k":"cours","a":1,"m":"","b":null,"p":"Une classe Voiture et une classe Moto répéteraient les mêmes champs — une marque, une méthode pour démarrer — si chacune était écrite à part. L'héritage évite cette copie. La classe dérivée, la fille, reçoit les propriétés et les méthodes de la classe de base, la mère, et n'ajoute que ce qui lui est propre. C'est…","h":["Le constructeur ne s'hérite pas","Une méthode, plusieurs comportements","Une classe qu'on ne construit pas","Fermer la descendance"]},{"s":"cours_interfaces_csharp","t":"Les interfaces en C#","d":"Cours détaillé sur les interfaces, l’injection de dépendances et l’architecture en couches.","k":"cours","a":1,"m":"","b":null,"p":"Une classe mélange souvent deux choses : le geste métier, « enregistrer ce véhicule », et le détail technique, « l'écrire dans un CSV » ou « l'écrire dans SQL ». Le jour où le stockage change, tout le service est à rouvrir. Une interface sépare les deux. Elle décrit un contrat : les méthodes qu'une classe devra…","h":["Écrire le contrat, puis une classe qui le tient","Recevoir le contrat, pas la classe concrète","Exercices d'application","TP guidé (1h)","Livrable attendu"]},{"s":"cours_tests_unitaires_csharp","t":"Les tests unitaires en C#","d":"Cours détaillé sur la démarche AAA, les tests nominaux/limites/exceptions et l’isolation de la logique métier.","k":"cours","a":1,"m":"","b":null,"p":"Un test unitaire exécute une action du service et compare le résultat à une valeur qu'on a décidée à l'avance. Il ne lance pas l'application. Il ne clique pas dans l'interface. Quand on modifie le calcul d'un devis, on relance la suite : les cas déjà justes doivent le rester. Un test qui casse signale une…","h":["Arrange, Act, Assert","Ne pas tester le disque en même temps que le devis","Exercices d'application","TP guidé (1h)","Livrable attendu"]},{"s":"cours_linq_json_csharp","t":"LINQ et JSON en C#","d":"Cours détaillé sur les requêtes LINQ, la sérialisation JSON et la robustesse des traitements.","k":"cours","a":1,"m":"","b":null,"p":"Une flotte de véhicules tient en mémoire dans une liste. On veut ceux qui sont disponibles, les trois plus chers, le prix moyen, le regroupement par type. Une boucle foreach sait le faire, et elle mélange le parcours, le test et l'accumulation. LINQ décrit le résultat. La lecture dit *quoi*, le compilateur s'occupe…","h":["Interroger la flotte","Écrire et relire un fichier JSON","Exercices d'application","TP guidé (1h)","Livrable attendu"]},{"s":"premiers_pas_csharp","t":"Premiers pas en C#","d":"","k":"cours","a":1,"m":"Syntaxe, Conditions, Boucles et Listes","b":"bts_csharp_intro","p":"","h":["Variables, méthodes, affichage","Décider avec if","Répéter avec for et while","Une liste qui grandit"]},{"s":"projet_rpg_csharp","t":"Projet Fil Rouge : Création d'un jeu 'FoxMon' (Type Pokémon)","d":"","k":"projet","a":1,"m":"C#, Projet, POO, Héritage, Polymorphisme, Console, Pokemon","b":null,"p":"Le but de ce projet est de créer un jeu console, en C#, inspiré de Pokémon, dont toutes les créatures sont des renards : les FoxMons. Le projet s'étale sur plusieurs séances. On avance dans l'ordre : la carte, le bestiaire, l'héritage, les attaques, les objets, les dresseurs, les dégâts, l'expérience, puis la…","h":["La carte et le dresseur 🗺️","Le bestiaire et le combat 🦊","L'héritage 🧬","Les attaques, lues dans un CSV 📄","Objets et capture 🧪","Les dresseurs sur la carte 🤝","Dégâts, types, critiques ⚔️","Expérience, évolution, grande carte 📈","Sauvegarde 💾"]},{"s":"exercices_poo","t":"TP : Les Bases de la POO en C#","d":"","k":"tp","a":1,"m":"Classes, Objets, Propriétés, Constructeurs, Héritage","b":"bts_poo_basics","p":"","h":["🏦 Exercice 1 : Gestion de Compte Bancaire (Niveau Débutant)","📚 Exercice 2 : Gestion de Livres (Niveau Débutant/Intermédiaire)","🎓 Exercice 3 : Gestion d'Étudiants (Niveau Intermédiaire)","🚗 Exercice 4 : Gestion de Concessionnaire (Niveau Intermédiaire/Avancé)","📂 Exercice 5 : Importation de Données CSV (Niveau Intermédiaire)","🐾 Exercice 6 : Animaux et Héritage (Niveau Avancé)","🏍️ Exercice 6 : Concessionnaire Multi-Véhicules"]},{"s":"tp_remediation_poo","t":"TP Remédiation : Les Bases Absolues de la POO en C#","d":"","k":"tp","a":1,"m":"Classes, Objets, Constructeurs, Instance, Static","b":"bts_poo_remediation","p":"","h":["🧱 Étape 1 : Syntaxe C# et Création de Classe","🪄 Étape 2 : L'Instanciation (Donner vie au code)","⚔️ Étape 3 : Interaction entre Objets","📦 Étape 4 : Stocker des objets dans une Liste","🔍 Étape 5 : Explorer et analyser une Liste","🏰 Étape 6 : GvG (Guilde vs Guilde)"]}]},{"n":"BTS SIO 1 : B3 - CyberSécurité","img":null,"list":[{"s":"rgpd_cnil","t":"Attendus RGPD & CNIL","d":"Politique de collecte et protection des données personnelles : RGPD, CNIL et droits des citoyens","k":"cours","a":1,"m":"","b":null,"p":"Un formulaire, un fichier de paie, une caméra, un cookie : dès qu'une information désigne une personne, le droit s'en mêle. Le RGPD, règlement général sur la protection des données, est le texte européen entré en application le 25 mai 2018. Il encadre le traitement des données personnelles sur tout le territoire de…","h":["Ce qu'on traite, et où le texte s'applique","La CNIL","Trois rôles à ne pas confondre","Six principes, et la preuve","De quel droit","Ce que la personne peut exiger","Ce que l'organisme doit tenir","Dès la conception, pas en rustine","Sortir de l'Union"]},{"s":"chiffrement_hachage","t":"Chiffrement et Hachage","d":"Fondamentaux de la cryptographie : chiffrement, hachage et signatures numériques","k":"cours","a":1,"m":"","b":null,"p":"La confidentialité, l'intégrité, l'authenticité et la non-répudiation ne se protègent pas avec le même outil. Quatre questions, quatre réponses.","h":["Trois mots qu'on confond","Alice, Bob, et le message en clair","Une lettre, toujours la même","Une lettre, plusieurs visages","La même clé des deux côtés","Trois exercices à la main","Ce qu'on utilise vraiment","Pourquoi la clé symétrique ne voyage pas","Deux clés, des rôles contraires"]},{"s":"introduction_cybersecurite","t":"Introduction à la cybersécurité","d":"Introduction aux concepts fondamentaux de la cybersécurité, les piliers CIA, les menaces courantes et la gestion des risques.","k":"cours","a":1,"m":"","b":null,"p":"Les organisations font tourner leur activité sur des systèmes d'information : dossiers, messagerie, paiement, production. Plus ces systèmes sont reliés, plus un incident les atteint loin. La cybersécurité est l'ensemble des mesures qui protègent les données, les infrastructures et la confiance qu'on leur porte.…","h":["Confidentialité, intégrité, disponibilité","De l'actif à l'impact","Des menaces qu'il faut savoir nommer","Estimer, puis traiter"]},{"s":"premiers_pas_python","t":"Premiers pas en Python","d":"","k":"cours","a":1,"m":"Variables, Conditions, Fonctions, Boucles et Listes","b":"bts_python_intro","p":"print écrit dans le terminal. On peut lui passer plusieurs valeurs, séparées par des virgules : il les affiche à la suite, avec un espace entre elles.","h":["Variables, affichage, saisie","Choisir selon une condition","Ranger un geste dans une fonction","Répéter","Listes et tuples"]},{"s":"cours_owasp_web","t":"Sécurité Web : OWASP, SQLi & XSS","d":"Cours complet sur le Top 10 OWASP, avec un focus technique sur les injections SQL et XSS (Préparation E5/E6).","k":"cours","a":1,"m":"","b":"bts_owasp_web","p":"","h":["Le Top 10 OWASP, édition 2021","Injections SQL, XSS, CSRF","Impact, et ce que la loi demande ensuite"]},{"s":"tp_cesar_vigenere","t":"TP - Chiffrement et Déchiffrement","d":"Implémentation des chiffrements de César, Vigenère et RSA en Python.","k":"tp","a":1,"m":"","b":null,"p":"","h":[]},{"s":"injections_sql","t":"TP - Sécurité Web : Injections SQL","d":"","k":"tp","a":1,"m":"Durée : 2 heures · Objectif : Comprendre pour mieux protéger","b":"bts_sql_injection","p":"","h":["Partie 1 : Découverte de l'injection SQL","Partie 2 : Analyse de logs d'attaque","Partie 3 : Solutions de protection","Partie 4 : Mini-rapport (15 min)","Livrables à rendre"]},{"s":"activite_mentions_legales","t":"TP : Audit RGPD d'un site web réel","d":"","k":"tp","a":1,"m":"Durée : 2 heures · Objectif : Comprendre pour mieux protéger","b":"bts_sql_audit_rgpd","p":"","h":["🔍 Partie 1 : Découverte des outils d'audit (20 min)","🛡️ Partie 2 : Audit complet d'un site web (50 min)","📋 Partie 3 : Recommandations de mise en conformité (40 min)","⚖️ Partie 4 : Rédaction des mentions légales (30 min)"]},{"s":"tp_injections_web","t":"TP SISR : Audit et Sécurisation d'une Application Web","d":"","k":"tp","a":1,"m":"Durée : 4 heures · Objectif : Attaquer, Comprendre, Réparer","b":"bts_sql_audit_rgpd","p":"","h":["Contexte du TP","Partie 1 : Mise en place du Lab","Partie 2 : Injection SQL (SQLi) - \"L'Effraction\"","Partie 3 : Cross-Site Scripting (XSS) - \"Le Piège\"","Partie 4 : Cross-Site Request Forgery (CSRF) - \"La Marionnette\"","Partie 4 bis : Mots de passe et Hachage","Partie 5 : Remédiation (Patching)","Partie 6 : Challenges CTF (Bonus)","Partie 7 : Le Rapport d'Audit"]},{"s":"tp_blockchain_python","t":"TP SLAM : Création d'une mini blockchain","d":"","k":"tp","a":1,"m":"Durée : 4 heures · Objectif : Attaquer, Comprendre, Réparer","b":"bts_sql_blockchain","p":"","h":["Objectifs Pédagogiques","Introduction : Le Grand Livre Numérique","Partie 1 : Le Hachage (Les fondations)","Partie 2 : La Brique Élémentaire (Classe Block)","Partie 3 : La Chaîne (Classe Blockchain)","Partie 4 : Sécurité et Attaque (Le cœur du sujet)","Partie 5 : Proof of Work (Le Minage)"]}]},{"n":"BTS SIO 2 : B1 - Support et mise à disposition de services informatiques","img":null,"list":[{"s":"activite_veille_e6","t":"Activité — Recherche documentaire (liste de sujets) — préparation E6","d":"Séance de 2 h : chaque étudiant ou binôme travaille un sujet imposé ou tiré au sort, et rend une fiche de synthèse","k":"tp","a":1,"m":"","b":null,"p":"Vous choisirez 4 sujets à aborder et faire une fiche de veille correspondante. Ce travail peut être fait en binôme.","h":[") Organisation",") Liste de sujets",") Exigences sur les sources (minimum à respecter dans le rendu)",") Modèle de rendu (à reproduire dans votre document)"]},{"s":"Gestion_projet","t":"Gestion de Projet Informatique","d":"Fondamentaux de la gestion de projet, rôles, méthodes et outils","k":"projet","a":1,"m":"","b":null,"p":"BTS SIO, bloc 1. Un service informatique ne s'installe pas tout seul. Derrière un site, une application, un réseau mis en place, il y a un projet : un ensemble d'activités temporaires, uniques et coordonnées, menées pour atteindre un objectif précis, dans un délai fixé, avec des ressources limitées. Le projet a un…","h":["Qui fait quoi","Le diagramme de Gantt","Deux façons d'enchaîner le travail","Les outils, et le geste Git"]},{"s":"Gestion_risques","t":"Gestion des Risques","d":"Identification, analyse et traitement des risques en projet informatique","k":"projet","a":1,"m":"","b":null,"p":"Un risque de projet est un événement incertain. S'il se produit, il écarte le projet de ses objectifs : délai, coût, qualité, périmètre. L'écart peut être négatif, un développeur absent la semaine de la livraison. Il peut être positif, une bibliothèque qui fait gagner dix jours : on parle alors d'opportunité, et on…","h":["La criticité, pour savoir par quoi commencer","Travaux dirigés : calcul de risques"]},{"s":"ITIL","t":"Introduction à ITIL","d":"Gestion des services informatiques et bonnes pratiques (ITIL v4)","k":"cours","a":1,"m":"","b":null,"p":"Un projet se termine le jour de la mise en service. Le serveur, lui, continue. Il faut surveiller, corriger, mettre à jour, répondre aux personnes qui s'en servent. Cette phase n'est plus de la gestion de projet : c'est de la gestion des services informatiques. ITIL (*Information Technology Infrastructure Library*)…","h":["Livrer, puis faire vivre","Quatre dimensions"]},{"s":"Chemin_critique","t":"Le Chemin Critique","d":"Méthode de planification et d'optimisation de projets","k":"cours","a":1,"m":"","b":null,"p":"Un projet est un réseau de tâches qui s'attendent. Certaines peuvent prendre du retard sans décaler la livraison. D'autres, non. Le chemin critique est la plus longue chaîne de tâches dépendantes, en durée. Sa longueur est la durée minimale du projet : on ne peut pas finir plus tôt que le plus long chemin. Tout…","h":["Calculer","Exercices pratiques"]},{"s":"Methodes_agiles","t":"Méthodes Agiles","d":"Introduction aux méthodes agiles (Scrum, Kanban) et à la gestion de projet moderne","k":"projet","a":1,"m":"","b":null,"p":"BTS SIO, bloc 1. Le chemin critique suppose qu'on connaît les tâches et leurs durées assez tôt pour figer un réseau. Beaucoup de projets informatiques n'ont pas cette stabilité : le besoin se précise quand on voit le logiciel tourner. Les méthodes agiles organisent le travail pour livrer souvent, montrer le…","h":["Scrum","Kanban","Une story, des critères, une définition de fini","Quand plusieurs équipes avancent ensemble"]},{"s":"Patrimoine_informatique","t":"Patrimoine Informatique","d":"Recensement et identification des ressources numériques (SIO Bloc 1)","k":"cours","a":1,"m":"","b":null,"p":"BTS SIO, bloc 1. Avant de sécuriser, de sauvegarder ou de remplacer quoi que ce soit, il faut savoir ce que l'organisation possède. Le patrimoine numérique regroupe les ressources dont le système d'information a besoin pour fonctionner : le matériel, les logiciels, et ce qui n'est ni l'un ni l'autre — comptes,…","h":["Pourquoi l'inventaire change le quotidien","L'audit s'appuie sur la liste","Trois familles de ressources","Comment on recense","Comment on le montre","Trois parcs, le même travail","Inventaire du projet d'atelier"]}]},{"n" function ic(name, size) { size = size || 16; return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); }
function key(s) { return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function lcs(L) { return '--lc:' + L.color + ';--lon:' + L.on; }
function lvl(id) { return LEVELS.filter(function (l) { return l.id === id; })[0]; }

});
function findCourse(level, slug) { return ALL.filter(function (c) { return c.level === level && c.s === slug; })[0]; }

});
function groupDone(g) { return g.members.filter(function (m) { return isDone(m.x); }).length; }
// Entrées affichées dans un chapitre : un groupe prend la place de son premier membre.
function chapterEntries(c) {
  var seen = {}, out = [];
  c.list.forEach(function (x) {
    if (x.extraOf) return;
    if (x.group && x.group.members.length > 1) {
      if (seen[x.group.id]) return;
      seen[x.group.id] = true;
      out.push({ g: x.group, kinds: x.group.members.map(function (m) { return m.x.k; }) });
    } else out.push({ x: x, kinds: [x.k] });
  });
  return out;
}

function isDone(x) { return state.student && x.level === STUDENT.level && !!DONE[x.s]; }

function canRead(x) { return !!x.a; }
function chapterDone(c) { return c.list.filter(isDone).length; }
function levelDone(id) { return CH[id].reduce(function (s, c) { return s + chapterDone(c); }, 0); }
function levelTotal(id) { return CH[id].reduce(function (s, c) { return s + c.list.length; }, 0); }

// Message d'accueil personnalisé : prénom, moment de la journée, et la prochaine étape.
function greeting() {
  var h = new Date().getHours();
  var hello = h < 5 || h >= 18 ? 'Bonsoir' : 'Bonjour';
  var x = resumeTarget(), L = lvl(STUDENT.level);
  var pct = Math.round(levelDone(L.id) / levelTotal(L.id) * 100);
  var st = x && EXO[x.s], left = st ? st.filter(function (v) { return !v; }).length : 0;
  var next = !x ? 'Tout est terminé, bravo !'
    : left ? 'Encore ' + left + ' exercice' + (left > 1 ? 's' : '') + ' pour finir « ' + esc(x.t) + ' ».'
    : 'Prochaine étape : « ' + esc(x.t) + ' ».';
  return '<div class="greet"><span class="av">' + STUDENT.initial + '</span><div><b>' + hello + ' ' + STUDENT.name + ' 👋 Tu en es à ' + pct + ' % de ' + L.label + '.</b><span>' + next + '</span></div></div>';
}
