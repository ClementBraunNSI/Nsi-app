  var pages = { academie: ['Académie', 'fox_act.png', 'Le jeu « Le renard dans le poulailler » garde sa page actuelle.'], 'a-propos': ['À propos', 'fox_3.png', 'La page À propos garde son contenu actuel.'], 'ren-arts': ['Chasse aux Ren’Arts', 'fox_chasse_renard.png', 'La galerie garde sa page actuelle.'], outils: ['Outils enseignants', 'fox_4.png', 'Page inchangée.'], mentions: ['Mentions légales', 'fox_0.png', 'Page inchangée.'] };
  var p = pages[name] || ['Page introuvable', 'fox_0.png', '404 : Vulpes not found.'];
  app.innerHTML = '<div class="wrap"><div class="card" style="max-width:560px;margin:50px auto;padding:40px;text-align:center"><img src="' + IMG + p[1] + '" alt="" style="height:150px;margin:0 auto 16px"><h1 class="h2">' + p[0] + '</h1><p style="color:var(--muted);margin:10px 0 22px">' + p[2] + ' Elle n’est pas reproduite dans la maquette.</p><a class="btn-acc" href="#/">Retour à l’accueil</a></div></div>';
}

// ================= routeur =================
var app = document.getElementById('app');
// Navigation interne : l'aperçu local bloque les ancres, on garde donc la route en mémoire.
var CUR = location.hash && location.hash.indexOf('#/') === 0 ? location.hash : '#/';
var HIST = [];
function go(h) {
  if (h !== CUR) { HIST.push(CUR); CUR = h; try { history.pushState(null, '', h); } catch (e) {} }
  route();
}
function back() { if (HIST.length) { CUR = HIST.pop(); try { history.replaceState(null, '', CUR); } catch (e) {} route(); } }
window.addEventListener('popstate', function () { if (location.hash.indexOf('#/') === 0) { CUR = location.hash; route(); } });
function parse() {
  var h = CUR.replace(/^#/, '') || '/';
  var qi = h.indexOf('?');
  var path = qi < 0 ? h : h.slice(0, qi), q = qi < 0 ? '' : h.slice(qi + 1);
  var query = {};
  q.split('&').filter(Boolean).forEach(function (kv) { var p = kv.split('='); query[p[0]] = decodeURIComponent(p[1] || ''); });
  return { parts: path.split('/').filter(Boolean), query: query };
}
var lastPath = null;
function route() {
  if (CUR === '#niveaux') return;
  closeModal();
  var r = parse(), p = r.parts;
  var pathKey = p.join('/');
  if (pathKey !== lastPath) { state.filter = 'all'; }
  renderHeader(r);
  app.style.animation = 'none'; void app.offsetWidth; app.style.animation = '';
  if (!p.length) renderHome();
  else if (p[0] === 'cours' && p.length === 1) renderAllLevels();
  else if (p[0] === 'cours' && p.length === 2) renderLevel(p[1], r.query);
  else if (p[0] === 'cours') renderCourse(p[1], p.slice(2).join('/'));
  else if (p[0] === 'espace') renderEspace();
  else if (p[0] === 'connexion') renderLogin(r.query);
  else renderMissing(p[0]);
  if (pathKey !== lastPath) window.scrollTo(0, 0);
  lastPath = pathKey;
  document.querySelectorAll('[data-i]').forEach(function (el) { el.innerHTML = ic(el.dataset.i, 18); });
}
document.getElementById('back').addEventListener('click', back);

// ================= interactions =================
function setStudent(v) {
  state.student = v;
  document.querySelectorAll('#who button').forEach(function (b) { b.classList.toggle('on', (b.dataset.v === 'student') === v); });
}
function seg(id, cb) {
  var box = document.getElementById(id);
  box.querySelectorAll('button').forEach(function (b) {
    b.addEventListener('click', function () {
      box.querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      cb(b.dataset.v);
    });
  });
}
function setTheme(dark) {
  document.documentElement.classList.toggle('dark', dark);
  document.querySelectorAll('#theme button').forEach(function (b) { b.classList.toggle('on', (b.dataset.v === 'dark') === dark); });
  renderHeader(parse());
}
seg('theme', function (v) { setTheme(v === 'dark'); });
seg('who', function (v) { setStudent(v === 'student'); lastPath = null; route(); });

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(toast.tm); toast.tm = setTimeout(function () { t.classList.remove('show'); }, 2600);
}

document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href^="#/"]');
  if (a && !e.target.closest('[data-pal]')) { e.preventDefault(); go(a.getAttribute('href')); return; }
  var t = e.target.closest('[data-filter],[data-pal],[data-scroll],[data-goto],[data-tab],[data-run],[data-check],[data-logout],[data-a11y],[data-toast],[data-close-modal],[data-group],.pal-item');
  if (!t) return;
  if (t.dataset.filter) { state.filter = t.dataset.filter; route(); }
  else if (t.hasAttribute('data-pal')) { e.preventDefault(); openPal(t.dataset.pal || ''); }
  else if (t.dataset.scroll) { e.preventDefault(); document.getElementById(t.dataset.scroll).scrollIntoView(); }
  else if (t.dataset.goto) { document.getElementById(t.dataset.goto).scrollIntoView(); }
  else if (t.dataset.tab) {
    var r = parse(), x = findCourse(r.parts[1], r.parts.slice(2).join('/')), tabs = exoTabsFor(x);
    t.parentNode.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === t); });
    document.getElementById('exo-body').innerHTML = exoPane(x, tabs, +t.dataset.tab);
  }
  else if (t.hasAttribute('data-run')) {
    document.getElementById('out').innerHTML = '<span class="info">&gt;&gt;&gt; exécution…</span>\n[1, 2, 3, 4, 5, 6]\n<span class="info">Terminé en 12 ms.</span>';
  }
  else if (t.dataset.check) { checkExercise(+t.dataset.check); }
  else if (t.hasAttribute('data-logout')) { setStudent(false); go('#/'); toast('Déconnexion réussie. À bientôt !'); }
  else if (t.dataset.a11y) {
    var k = t.dataset.a11y;
    if (k === 'toggle') a11y.open = !a11y.open;
    else if (k === 'dark') { setTheme(!document.documentElement.classList.contains('dark')); return; }
    else if (k === 'dyslexic') { a11y.dyslexic = !a11y.dyslexic; document.documentElement.classList.toggle('dyslexic', a11y.dyslexic); }
    else if (k === 'contrast') { a11y.contrast = !a11y.contrast; document.documentElement.classList.toggle('high-contrast', a11y.contrast); }
    renderHeader(parse());
  }
  else if (t.dataset.toast) { toast(t.dataset.toast); }
  else if (t.hasAttribute('data-close-modal')) { closeModal(); route(); }
  else if (t.dataset.group) { openGroup(GROUPS[+t.dataset.group]); }
  else if (t.classList.contains('pal-item')) { closePal(); go(t.dataset.href); }
});

function checkExercise(i) {
  var r = parse(), x = findCourse(r.parts[1], r.parts.slice(2).join('/')), tabs = exoTabsFor(x);
  var out = document.getElementById('out');
  out.innerHTML = '<span class="info">Vérification avec 4 tests cachés…</span>';
  setTimeout(function () {
    out.innerHTML = '<span class="pass">✓ liste vide</span>\n<span class="pass">✓ un seul élément</span>\n<span class="pass">✓ liste déjà triée</span>\n<span class="pass">✓ liste aléatoire (1000 éléments)</span>\n' +
      (state.student ? '<span class="pass">Bravo, exercice validé ! Progression enregistrée.</span>' : '<span class="warn">Bravo ! Connecte-toi pour enregistrer ta progression et gagner le badge.</span>');
    var store = state.student ? (EXO[x.s] = EXO[x.s] || tabs.map(function () { return false; })) : EXO['_v_' + x.s];
    store[i] = true;
    var btn = document.querySelector('.exo-tabs [data-tab="' + i + '"]');
    if (btn && !btn.querySelector('.okd')) btn.insertAdjacentHTML('afterbegin', '<span class="okd">' + ic('check', 13) + '</span>');
    if (state.student && store.every(Boolean) && !DONE[x.s]) {
      DONE[x.s] = true;
      setTimeout(function () { showBadge(x); }, 500);
    }
  }, 650);
}
function showBadge(x) {
  var img = x.b ? IMG + 'badges/' + x.b + '.png' : IMG + lvl(x.level).fox;
  document.getElementById('modal-box').className = 'card modal';
  document.getElementById('modal-box').innerHTML = '<span class="eyebrow">' + (x.b ? 'Badge débloqué !' : 'Fiche terminée !') + '</span><img src="' + img + '" alt=""><h2>' + esc(x.t) + '</h2><p>Tous les exercices sont validés. Bien joué, ' + STUDENT.name + ' 🦊</p><button class="btn-acc" data-close-modal>Continuer</button>';
  document.getElementById('modal').classList.add('open');
}

// ----- palette de recherche -----
var palSel = 0, palItems = [];
function openPal(q) {
  document.getElementById('pal').classList.add('open');
  var input = document.getElementById('pal-q');
  input.value = q; renderPal(); setTimeout(function () { input.focus(); }, 10);
}
function closePal() { document.getElementById('pal').classList.remove('open'); }
function hl(text, q) {
  if (!q) return esc(text);
  var i = norm(text).indexOf(norm(q));
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}
function renderPal() {
  var q = document.getElementById('pal-q').value.trim(), nq = norm(q);
  var levels = LEVELS.filter(function (L) { return !L.hidden && (!nq || norm(L.label + ' ' + L.aud).indexOf(nq) >= 0); });
  var courses = !nq ? ALL.filter(function (x) { return x.level === (state.student ? STUDENT.level : '1nsi'); }).slice(0, 6)
    : ALL.filter(function (x) { return norm(x.t + ' ' + x.d + ' ' + x.chapter.name + ' ' + (x.h || []).join(' ')).indexOf(nq) >= 0; })
         .sort(function (a, b) { return (norm(b.t).indexOf(nq) >= 0) - (norm(a.t).indexOf(nq) >= 0); }).slice(0, 12);
  palItems = [];
  var html = '';
  if (courses.length) {
    html += '<div class="grp">' + (nq ? 'Cours et exercices' : 'Suggestions') + '</div>';
    courses.forEach(function (x) {
      palItems.push(href(x.level, x.s));
      html += '<a class="pal-item" data-href="' + href(x.level, x.s) + '"><span class="ic">' + chImg(x.chapter) + '</span><span class="t"><b>' + hl(x.t, q) + '</b><span>' + lvl(x.level).label + ' · ' + esc(x.chapter.name) + '</span></span><span class="kind k-' + x.k + '">' + KIND[x.k].l + '</span>' + (canRead(x) ? '' : '<span class="lock">' + ic('lock', 13) + '</span>') + '</a>';
    });
  }
  if (levels.length) {
    html += '<div class="grp">Niveaux</div>';
    levels.forEach(function (L) {
      palItems.push(href(L.id));
      html += '<a class="pal-item" data-href="' + href(L.id) + '"><span class="ic"><img class="fox" src="' + IMG + L.fox + '" alt=""></span><span class="t"><b>' + hl(L.label, q) + '</b><span>' + L.aud + ' · ' + levelTotal(L.id) + ' ressources</span></span></a>';
    });
  }
  if (!html) html = '<div class="empty">Aucun résultat pour « ' + esc(q) + ' ». 🦊</div>';
  document.getElementById('pal-res').innerHTML = html;
  palSel = 0; markPal();
}
function markPal() {
  document.querySelectorAll('.pal-item').forEach(function (el, i) { el.classList.toggle('sel', i === palSel); if (i === palSel) el.scrollIntoView({ block: 'nearest' }); });
}
document.getElementById('pal-q').addEventListener('input', renderPal);
document.getElementById('pal').addEventListener('click', function (e) { if (e.target.id === 'pal') closePal(); });
document.getElementById('modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', function (e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPal(''); return; }
  if (e.key === 'Escape' && document.getElementById('modal').classList.contains('open')) { closeModal(); return; }
  if (!document.getElementById('pal').classList.contains('open')) return;
  if (e.key === 'Escape') closePal();
  else if (e.key === 'ArrowDown') { e.preventDefault(); palSel = Math.min(palSel + 1, palItems.length - 1); markPal(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); palSel = Math.max(palSel - 1, 0); markPal(); }
  else if (e.key === 'Enter' && palItems[palSel]) { closePal(); go(palItems[palSel]); }
});

// ----- barre de lecture et phrases d'accroche -----
function updateReadBar() {
  var bar = document.getElementById('readbar');
  if (!bar) return;
  var onCourse = parse().parts.length > 2;
  var max = document.documentElement.scrollHeight - innerHeight;
  bar.style.width = onCourse && max > 0 ? (scrollY / max * 100) + '%' : '0';
}
window.addEventListener('scroll', updateReadBar, { passive: true });
var si = 0;
setInterval(function () { var s = document.getElementById('splash'); if (s) { si = (si + 1) % SPLASH.length; s.textContent = SPLASH[si]; } }, 4000);

route();
</script>
