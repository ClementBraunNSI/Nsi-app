<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maquettes de la barre de navigation · série 2</title>
<style>
  /* Variables reprises de app/globals.css. Aucune ressource externe : police du système si Geist n'est pas installée. */
  :root {
    --bg: #f7f4ef; --surface: #fffcf8; --surface-2: #f1ece4;
    --fg: #14110e; --muted: #5c564e; --subtle: #8a8278;
    --border: color-mix(in srgb, #14110e 10%, transparent);
    --accent: #ea580c; --accent-fg: #ffffff; --accent-soft: #fff1e6;
    --radius: 1.15rem; --radius-sm: .7rem;
    --inset: inset 0 1px 0 rgba(255,255,255,.72);
    --shadow: var(--inset), 0 1px 1px rgba(20,17,14,.03), 0 22px 50px -32px rgba(20,17,14,.28);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  :root.dark {
    --bg: #0c1017; --surface: #161c27; --surface-2: #1e2633;
    --fg: #f6f1ea; --muted: #c4bdb3; --subtle: #8b847b;
    --border: color-mix(in srgb, #f6f1ea 12%, transparent);
    --accent: #fb923c; --accent-fg: #1a1204; --accent-soft: #2a2013;
    --inset: inset 0 1px 0 rgba(255,255,255,.06);
    --shadow: var(--inset), 0 18px 44px -30px rgba(0,0,0,.7);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--fg); font-family: Geist, "Segoe UI", system-ui, sans-serif; letter-spacing: -.011em; }
  img, svg { display: block; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  .ic { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ----- habillage de la page de maquettes ----- */
  .switcher { position: sticky; top: 0; z-index: 60; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 10px; background: #1d1712; }
  .switcher button, .switcher a { font-weight: 600; font-size: 14px; border-radius: 999px; padding: 8px 16px; background: #3a312a; color: #e9e4dc; }
  .switcher button.on { background: #ea580c; color: #fff; }
  .switcher .theme { margin-left: 18px; background: #e9e4dc; color: #1d1712; }
  .switcher a { background: none; text-decoration: underline; }
  .page { max-width: 1320px; margin: 0 auto; padding: 28px 20px 80px; }
  .mock { display: none; } .mock.on { display: block; }
  .mock h1 { font-size: 26px; font-weight: 600; letter-spacing: -.025em; }
  .mock h1 span { color: var(--accent); }
  .why { max-width: 760px; margin: 8px 0 0; font-size: 15px; line-height: 1.6; color: var(--muted); }
  .why b { color: var(--fg); font-weight: 600; }
  .label { margin: 26px 0 8px; font-size: 12px; font-weight: 600; color: var(--subtle); }
  .frame { position: relative; border: 1px solid var(--border); border-radius: 14px; background: var(--bg); overflow: hidden; box-shadow: var(--shadow); }
  .stage { width: 1280px; height: 250px; overflow: hidden; }
  .phones { display: flex; flex-wrap: wrap; gap: 20px; }
  .phone { width: 375px; }
  .phone .stage { width: 375px; height: 230px; }

  /* Un morceau de page sous la barre, pour juger l'ensemble. */
  .under { max-width: 80rem; margin: 0 auto; padding: 44px 32px 0; }
  .under i { display: inline-flex; font-style: normal; font-size: 13px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); border-radius: 999px; padding: 6px 14px; }
  .under b { display: block; margin-top: 16px; font-size: 64px; font-weight: 600; line-height: 1; letter-spacing: -.035em; }
  .under b em { font-style: normal; color: var(--accent); }
  .phone .under { padding: 30px 16px 0; }
  .phone .under b { font-size: 40px; }

  /* ----- structure commune des barres ----- */
  .nb { position: relative; z-index: 2; }
  .nb-in { max-width: 80rem; margin: 0 auto; height: 100%; display: flex; align-items: center; gap: 16px; padding: 0 24px; }
  .nb-brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; font-size: 16px; font-weight: 600; letter-spacing: -.025em; white-space: nowrap; }
  .nb-brand b { font-weight: 600; color: var(--accent); }
  .nb-brand small { font-size: inherit; font-weight: 600; color: var(--muted); }
  .nb-links { position: relative; display: flex; align-items: center; gap: 20px; margin-left: auto; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  .nb-links a { position: relative; display: inline-flex; align-items: center; gap: 6px; }
  .nb-links a.on { color: var(--accent); }
  .tabhead, .marker { display: none; }
  .badge { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--accent); color: var(--accent-fg); font-size: 11px; font-weight: 700; }
  .nb-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; margin-left: 10px; font-size: 14px; font-weight: 600; }
  .eye { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; color: var(--muted); }
  .login { padding: 10px 20px; border-radius: 12px; background: var(--fg); color: var(--bg); }
  .resume { padding: 8px 12px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-size: 12px; }
  .avatar { display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 12px; border: 1px solid var(--border); }
  .avatar span { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-size: 12px; font-weight: 700; }
  .logout { display: flex; align-items: center; gap: 8px; padding: 10px; border-radius: 12px; color: var(--muted); font-size: 12px; }
  .burger { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--border); }
  .phone .nb-in { padding: 0 12px 0 16px; gap: 8px; }
  .phone .nb-brand { font-size: 15px; gap: 8px; margin-right: auto; }
  .phone .nb-actions { margin-left: 0; }
  .phone .login { padding: 10px 13px; }
  .phone .avatar { padding: 6px; }

  /* ============ F : médaillon ============ */
  .nb-f { height: 60px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .nb-f .nb-brand { align-self: flex-start; align-items: flex-start; gap: 14px; }
  .nb-f .medal { display: grid; place-items: center; width: 80px; height: 80px; margin-top: 6px; border-radius: 50%; background: var(--surface); border: 2px solid color-mix(in srgb, var(--accent) 50%, var(--border)); box-shadow: var(--shadow); transition: transform 250ms var(--ease); }
  .nb-f .nb-brand:hover .medal { transform: rotate(-8deg) scale(1.05); }
  .nb-f .medal svg { width: 54px; height: 45px; margin-top: 3px; }
  .nb-f .txt { margin-top: 20px; }
  .phone .nb-f { height: 56px; }
  .phone .nb-f .medal { width: 60px; height: 60px; margin-top: 5px; }
  .phone .nb-f .medal svg { width: 40px; height: 33px; }
  .phone .nb-f .txt { margin-top: 18px; }

  /* ============ G : la tête indique la page ============ */
  .nb-g { height: 68px; border-bottom: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); background: var(--surface); }
  .nb-g .nb-brand { font-size: 18px; }
  .nb-g .nb-brand small { font-size: 14px; font-weight: 500; }
  .nb-g .nb-links { align-self: stretch; gap: 24px; }
  .nb-g .marker { display: block; position: absolute; left: 0; bottom: -14px; width: 30px; height: 25px; transform: translateX(-50%); transition: left 380ms var(--ease); pointer-events: none; }
  .nb-g .glogo { display: none; }
  .phone .nb-g { height: 58px; }
  .phone .nb-g .nb-brand { font-size: 16px; }
  .phone .nb-g .glogo { display: block; width: 34px; height: 28px; }

  /* ============ H : onglets ============ */
  .nb-h { height: 72px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
  .nb-h .fox-walk { height: 50px; width: auto; }
  .nb-h .nb-links { align-self: flex-end; gap: 2px; margin-left: 20px; }
  .nb-h .nb-links a { padding: 11px 16px 13px; margin-bottom: -1px; border: 1px solid transparent; border-bottom: 0; border-radius: 13px 13px 0 0; }
  .nb-h .nb-links a.on { background: var(--bg); border-color: var(--border); color: var(--fg); }
  .nb-h .nb-links a.on .tabhead { display: block; width: 19px; height: 16px; }
  .nb-h .nb-actions { margin-left: auto; }
  .nb-h .eye { background: var(--surface); border: 1px solid var(--border); }
  .nb-h.is-student .nb-brand small { display: none; }
  .phone .nb-h { height: 60px; }
  .phone .nb-h .fox-walk { width: 44px; height: 44px; object-fit: cover; object-position: 100% 0; }

  /* ============ I : la tête dans le nom ============ */
  .nb-i { height: 64px; border-bottom: 1px solid var(--border); background: var(--surface); }
  .nb-i .nb-brand { font-size: 23px; gap: 10px; }
  .nb-i .nb-brand b { display: inline-flex; align-items: baseline; }
  .nb-i .o { display: inline-block; width: 1.26em; height: 1.05em; margin: 0 -.03em; align-self: center; transform: translateY(-.02em); transition: transform 250ms var(--ease); }
  .nb-i .nb-brand:hover .o { transform: translateY(-.02em) rotate(-14deg); }
  .nb-i .nb-brand small { font-size: 14px; font-weight: 500; }
  .nb-i .nb-links a.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: -7px; height: 2px; border-radius: 2px; background: var(--accent); }
  .phone .nb-i { height: 58px; }
  .phone .nb-i .nb-brand { font-size: 19px; }

  /* ============ J : renard assis ============ */
  .nb-j { height: 72px; border-bottom: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); background: var(--surface); }
  .nb-j .nb-brand { align-self: stretch; gap: 8px; }
  /* Le dessin occupe le milieu de son carré : on le recadre pour poser les pattes sur le trait. */
  .nb-j .sit { position: relative; align-self: flex-end; width: 60px; height: 68px; overflow: hidden; }
  .nb-j .sit img { position: absolute; left: -14px; top: -13px; width: 98px; height: 98px; max-width: none; }
  .phone .nb-j { height: 60px; }
  .phone .nb-j .sit { width: 49px; height: 56px; }
  .phone .nb-j .sit img { left: -11px; top: -10px; width: 80px; height: 80px; }

  /* ============ K : barre flottante coiffée de la tête ============ */
  .nb-k { padding: 24px 20px 0; }
  .nb-k .nb-in { position: relative; max-width: 76rem; height: 56px; padding: 0 10px 0 0; border-radius: 18px; border: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px); box-shadow: var(--shadow); }
  .nb-k .nb-brand { position: relative; height: 100%; padding-left: 104px; }
  .nb-k .khead { position: absolute; left: 8px; top: -15px; width: 88px; height: 74px; filter: drop-shadow(0 8px 8px rgba(20,17,14,.2)); transition: transform 250ms var(--ease); transform-origin: 50% 90%; }
  .nb-k .nb-brand:hover .khead { transform: rotate(-7deg); }
  .nb-k .nb-links { gap: 4px; }
  .nb-k .nb-links a { padding: 7px 12px; border-radius: 999px; }
  .nb-k .nb-links a.on { background: var(--accent-soft); }
  .nb-k .login { background: var(--accent); color: var(--accent-fg); }
  .nb-k .logout span { display: none; }
  .phone .nb-k { padding: 18px 8px 0; }
  .phone .nb-k .nb-in { height: 52px; padding: 0 6px 0 0; border-radius: 16px; }
  .phone .nb-k .nb-brand { padding-left: 76px; }
  .phone .nb-k .khead { left: 5px; top: -11px; width: 66px; height: 55px; }
  .phone .nb-k .burger { width: 40px; height: 40px; border: 0; }
</style>
</head>
<body>

<!-- Icônes (tracés Lucide, déjà utilisés par le site) et tête de renard de l'onglet du navigateur (app/icon.svg, components/ui/FoxHead.tsx). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 5h16"/><path d="M4 12h16"/><path d="M4 19h16"/></symbol>
  <symbol id="fox-head" viewBox="730 285 641 535">
    <path d="M818 292L983 437L848 560Q818 430 818 292Z" fill="#E4742B"/><path d="M835 337Q900 425 947 468L880 530Q852 450 835 337Z" fill="#281E1E"/>
    <path d="M1283 292L1119 437L1254 560Q1283 430 1283 292Z" fill="#E4742B"/><path d="M1266 337Q1201 425 1155 468L1222 530Q1249 450 1266 337Z" fill="#281E1E"/>
    <polygon points="735,662 1366,662 1080,815 1023,815" fill="#F9F6E3"/>
    <polygon points="983,437 1051,437 1051,760 1028,766 995,660 968,613 912,598 862,634 735,662" fill="#EE973B"/>
    <polygon points="1119,437 1051,437 1051,760 1074,766 1107,660 1133,613 1190,598 1240,634 1366,662" fill="#E4742B"/>
    <polygon points="862,634 912,598 938,643 995,660 1028,766 980,700" fill="#C24F2E"/><polygon points="1240,634 1190,598 1164,643 1107,660 1074,766 1122,700" fill="#C24F2E"/>
    <polygon points="912,598 968,613 984,630 995,660 938,643" fill="#281E1E"/><polygon points="1190,598 1133,613 1117,630 1107,660 1164,643" fill="#281E1E"/>
    <polygon points="735,662 862,634 980,700 1000,745 1023,772 1051,797 1023,812" fill="#F9F6E3"/><polygon points="1366,662 1240,634 1122,700 1102,745 1080,772 1051,797 1080,812" fill="#F9F6E3"/>
    <path d="M1030 762L1051 758L1072 762L1080 772Q1066 790 1051 797Q1036 790 1023 772Z" fill="#281E1E"/><polygon points="1023,810 1051,797 1080,810 1072,815 1030,815" fill="#281E1E"/>
  </symbol>
</svg>

<div class="switcher" id="switcher"></div>
<div class="page" id="page"></div>

<script>
  // Les mêmes entrées que components/layout/SiteHeader.tsx : rien n'est ajouté ni retiré.
  const VISITOR = [["Accueil"], ["À propos", true]];
  const STUDENT = [...VISITOR, ["Évaluations", false, 2], ["Défi", false, 1], ["Ma classe", false, 3]];
  const WALK = "../public/images/fox_3_mark.png";
  const SIT = "../public/images/fox_assis.svg";
  const icon = (id) => `<svg class="ic"><use href="#i-${id}"/></svg>`;
  const head = (cls) => `<svg class="${cls}" aria-hidden="true"><use href="#fox-head"/></svg>`;

  const VARIANTS = [
    { id: "f", name: "Médaillon", title: "F. La tête en <span>médaillon</span>",
      why: "La tête de renard de l'onglet du navigateur devient le logo, dans un médaillon rond posé à cheval sur le bord de la barre. La barre descend à 60 px au lieu de 80. Au survol, le médaillon penche. <b>À savoir :</b> le médaillon recouvre un petit coin de la page, en haut à gauche." },
    { id: "g", name: "La tête indique la page", title: "G. La tête <span>indique la page</span>",
      why: "Plus de logo à gauche : le nom du site seul. La tête de renard se pose sous la page active, à cheval sur le trait orange, et glisse d'un lien à l'autre au survol (à essayer à la souris). <b>À savoir :</b> sur téléphone, les liens sont dans le menu : la tête revient donc devant le nom du site." },
    { id: "h", name: "Onglets", title: "H. Des <span>onglets</span>, avec leur icône",
      why: "Les liens deviennent des onglets, comme ceux du navigateur. L'onglet actif prend la couleur de la page et porte la tête de renard, comme l'icône d'un onglet. Le renard qui marche reste à gauche, en plus petit. <b>À savoir :</b> « par Clément BRAUN » est retiré quand l'élève est connecté, faute de place, et sur téléphone il n'y a pas d'onglets." },
    { id: "i", name: "Dans le nom", title: "I. La tête <span>dans le nom</span>",
      why: "La tête de renard remplace le « o » de « Code ». Aucun autre logo : c'est la barre la plus sobre de la série, 64 px de haut. Au survol, la tête penche. <b>À savoir :</b> le nom se lit un peu moins vite. Les lecteurs d'écran, eux, lisent toujours « La tanière du Code »." },
    { id: "j", name: "Renard assis", title: "J. Le renard <span>assis</span> sur le trait",
      why: "Le renard qui marche laisse sa place au renard assis, celui de l'ancienne page À propos, posé sur le trait orange. Il cligne des yeux et remue les oreilles. Le logo est deux fois moins large, ce qui laisse de la place aux liens des élèves connectés. <b>À savoir :</b> le renard qui marche disparaît de la barre." },
    { id: "k", name: "Flottante coiffée", title: "K. Barre flottante, <span>coiffée</span> de la tête",
      why: "La barre flottante de la série 1, coiffée de la tête de renard : les oreilles dépassent au-dessus, le museau en dessous. Au survol, la tête penche. <b>À savoir :</b> il faut une marge de 24 px au-dessus de la barre pour les oreilles, et « Déconnexion » se réduit à son icône." },
  ];

  function brand(v, phone) {
    const by = phone ? "" : " <small>par Clément BRAUN</small>";
    const name = `<span class="txt"><b>La tanière du Code</b>${by}</span>`;
    switch (v.id) {
      case "f": return `<a class="nb-brand" href="#"><span class="medal">${head("")}</span>${name}</a>`;
      case "g": return `<a class="nb-brand" href="#">${head("glogo")}${name}</a>`;
      case "h": return `<a class="nb-brand" href="#"><img class="fox-walk" src="${WALK}" alt="">${name}</a>`;
      case "i": return `<a class="nb-brand" href="#" aria-label="La tanière du Code"><b>La tanière du C${head("o")}de</b>${by}</a>`;
      case "j": return `<a class="nb-brand" href="#"><span class="sit"><img src="${SIT}" alt=""></span>${name}</a>`;
      default: return `<a class="nb-brand" href="#">${head("khead")}${name}</a>`;
    }
  }

  function bar(v, student, phone) {
    const links = (student ? STUDENT : VISITOR)
      .map(([label, on, n]) => `<a href="#" class="${on ? "on" : ""}">${head("tabhead")}${label}${n ? `<span class="badge">${n}</span>` : ""}</a>`)
      .join("");
    const account = student
      ? (phone
          ? `<a class="avatar" href="#"><span>C</span></a>`
          : `<a class="resume" href="#">Reprendre</a><a class="avatar" href="#"><span>C</span>Camille</a><button class="logout" title="Déconnexion">${icon("out")}<span>Déconnexion</span></button>`)
      : `<a class="login" href="#">Connexion</a>`;
    const inner = phone
      ? `${brand(v, true)}<div class="nb-actions">${account}<button class="burger" aria-label="Ouvrir le menu">${icon("menu")}</button></div>`
      : `${brand(v, false)}<nav class="nb-links">${links}${head("marker")}</nav><div class="nb-actions"><button class="eye" title="Accessibilité">${icon("eye")}</button>${account}</div>`;
    return `<header class="nb nb-${v.id}${student ? " is-student" : ""}"><div class="nb-in">${inner}</div></header>
      <div class="under"><i>Certifié de NSI, TZR</i><b>Clément <em>Braun</em></b></div>`;
  }

  const page = document.getElementById("page");
  const switcher = document.getElementById("switcher");
  page.innerHTML = VARIANTS.map((v) => `
    <section class="mock" id="m-${v.id}">
      <h1>${v.title}</h1>
      <p class="why">${v.why}</p>
      <p class="label">Visiteur</p>
      <div class="frame desk"><div class="stage">${bar(v, false, false)}</div></div>
      <p class="label">Élève connecté (trois liens de plus, avec leurs pastilles)</p>
      <div class="frame desk"><div class="stage">${bar(v, true, false)}</div></div>
      <p class="label">Téléphone : visiteur, puis élève connecté. Le menu qui s'ouvre ne change pas.</p>
      <div class="phones">
        <div class="frame phone"><div class="stage">${bar(v, false, true)}</div></div>
        <div class="frame phone"><div class="stage">${bar(v, true, true)}</div></div>
      </div>
    </section>`).join("");

  // Variante G : la tête se place sous le lien actif et suit la souris.
  function placeMarkers() {
    document.querySelectorAll(".nb-g .nb-links").forEach((nav) => {
      const marker = nav.querySelector(".marker");
      const active = nav.querySelector("a.on");
      const go = (link) => { marker.style.left = link.offsetLeft + link.offsetWidth / 2 + "px"; };
      go(active);
      nav.querySelectorAll("a").forEach((link) => {
        link.onmouseenter = () => go(link);
        link.onmouseleave = () => go(active);
      });
    });
  }

  function show(id) {
    document.querySelectorAll(".mock").forEach((m) => m.classList.toggle("on", m.id === "m-" + id));
    switcher.querySelectorAll("[data-v]").forEach((b) => b.classList.toggle("on", b.dataset.v === id));
    fit();
    placeMarkers();
  }
  // Les cadres « ordinateur » sont dessinés à 1280 px puis réduits à la largeur disponible.
  function fit() {
    document.querySelectorAll(".frame.desk").forEach((frame) => {
      const stage = frame.firstElementChild;
      stage.style.zoom = 1;
      if (frame.clientWidth) stage.style.zoom = Math.min(1, frame.clientWidth / 1280);
    });
  }
  switcher.innerHTML = VARIANTS.map((v) => `<button data-v="${v.id}">${v.id.toUpperCase()} · ${v.name}</button>`).join("")
    + `<button class="theme" id="theme">Thème sombre</button><a href="maquettes-navbar.html">Série 1 (A à E)</a>`;
  switcher.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (!button) return;
    if (button.id === "theme") {
      const dark = document.documentElement.classList.toggle("dark");
      button.textContent = dark ? "Thème clair" : "Thème sombre";
    } else {
      show(button.dataset.v);
      history.replaceState(null, "", "#" + button.dataset.v);
    }
  });
  window.addEventListener("resize", fit);
  show(VARIANTS.some((v) => v.id === location.hash.slice(1)) ? location.hash.slice(1) : "f");
</script>
</body>
</html>
