  - id: donnees-1
    label: "Introduction \U0001F98A - Lire un CSV avec pandas"
    content: "### Introduction \U0001F98A - Lire un CSV avec pandas\n\n      Le module **pandas** permet de manipuler un CSV comme un **tableur Excel** en Python.\n\n      Voici un extrait de base de données :\n\n      ```csv\n      Nom,Espece,Habitat,Poids_kg,Longueur_cm\n      Rusty,Vulpes vulpes,Forêt tempérée,6.5,58\n      Arctic,Vulpes lagopus,Toundra arctique,3.2,46\n      Fennec,Vulpes zerda,Désert,1.5,24\n      Silver,Vulpes vulpes,Forêt boréale,7.1,61\n      ```\n\n      **Mission :** Chargez ces données dans un DataFrame `df` avec `pnd.read_csv(StringIO(...))`, puis stockez le **nombre de renards** (lignes de données) dans `nb_renards`.\n\n      *Indice :* `len(df)` compte les lignes du tableau."
    difficulty: introduction
    type: sql
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      import pandas as pnd
      from io import StringIO

      csv_texte = """Nom,Espece,Habitat,Poids_kg,Longueur_cm
      Rusty,Vulpes vulpes,Forêt tempérée,6.5,58
      Arctic,Vulpes lagopus,Toundra arctique,3.2,46
      Fennec,Vulpes zerda,Désert,1.5,24
      Silver,Vulpes vulpes,Forêt boréale,7.1,61"""

      attendu = pnd.read_csv(StringIO(csv_texte))
      assert 'df' in locals(), "Créez un DataFrame nommé df."
      assert 'nb_renards' in locals(), "Créez la variable nb_renards."
      assert len(df) == len(attendu), "Le tableau doit contenir toutes les lignes de données."
      assert nb_renards == len(attendu), "nb_renards doit correspondre au nombre de lignes."
      ```
    niveau: snt
    notion: Données structurées
  - id: donnees-2
    label: "Introduction \U0001F98A - Les colonnes du tableau"
    content: "### Introduction \U0001F98A - Les colonnes du tableau\n\n      Comme dans Excel, chaque **colonne** a un nom (l'en-tête du CSV).\n\n      **Mission :** À partir du DataFrame `df` ci-dessous, stockez la liste des noms de colonnes dans `colonnes` et le nombre de colonnes dans `nb_colonnes`.\n\n      ```python\n      import pandas as pnd\n      from io import StringIO\n\n      csv_texte = \"\"\"Nom,Espece,Habitat,Poids_kg,Longueur_cm\n      Rusty,Vulpes vulpes,Forêt tempérée,6.5,58\n      Arctic,Vulpes lagopus,Toundra arctique,3.2,46\n      Fennec,Vulpes zerda,Désert,1.5,24\n      Silver,Vulpes vulpes,Forêt boréale,7.1,61\"\"\"\n\n      df = pnd.read_csv(StringIO(csv_texte))\n      ```\n\n      *Indice :* `df.columns` donne les noms de colonnes. Convertissez en liste avec `.tolist()`."
    difficulty: introduction
    type: sql
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      import pandas as pnd
      from io import StringIO

      csv_texte = """Nom,Espece,Habitat,Poids_kg,Longueur_cm
      Rusty,Vulpes vulpes,Forêt tempérée,6.5,58
      Arctic,Vulpes lagopus,Toundra arctique,3.2,46
      Fennec,Vulpes zerda,Désert,1.5,24
      Silver,Vulpes vulpes,Forêt boréale,7.1,61"""
      df = pnd.read_csv(StringIO(csv_texte))

      assert 'colonnes' in locals(), "Créez la variable colonnes."
      assert 'nb_colonnes' in locals(), "Créez la variable nb_colonnes."
      assert colonnes == df.columns.tolist(), "colonnes doit reprendre les en-têtes du CSV."
      assert nb_colonnes == len(df.columns), "nb_colonnes doit compter les colonnes."
      assert "Poids_kg" in colonnes, "Le fichier contient une colonne Poids_kg."
      ```
    niveau: snt
    notion: Données structurées
  - id: donnees-3
    label: "Introduction \U0001F98A - Lire une cellule"
    content: "### Introduction \U0001F98A - Lire une cellule\n\n      On peut accéder à une **cellule** comme dans un tableur : `df.loc[ligne, \"Colonne\"]`.\n\n      **Mission :** À partir du `df` fourni, stockez dans `poids_fennec` le poids (en kg) du renard dont le nom est **Fennec**.\n\n      ```python\n      import pandas as pnd\n      from io import StringIO\n\n      csv_texte = \"\"\"Nom,Espece,Habitat,Poids_kg,Longueur_cm\n      Rusty,Vulpes vulpes,Forêt tempérée,6.5,58\n      Arctic,Vulpes lagopus,Toundra arctique,3.2,46\n      Fennec,Vulpes zerda,Désert,1.5,24\n      Silver,Vulpes vulpes,Forêt boréale,7.1,61\"\"\"\n\n      df = pnd.read_csv(StringIO(csv_texte))\n      ```\n\n      *Indice :* filtrez d'abord la ligne : `df[df[\"Nom\"] == \"Fennec\"]`, puis lisez la colonne `Poids_kg`."
    difficulty: introduction
    type: sql
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      import pandas as pnd
      from io import StringIO

      csv_texte = """Nom,Espece,Habitat,Poids_kg,Longueur_cm
      Rusty,Vulpes vulpes,Forêt tempérée,6.5,58
      Arctic,Vulpes lagopus,Toundra arctique,3.2,46
      Fennec,Vulpes zerda,Désert,1.5,24
      Silver,Vulpes vulpes,Forêt boréale,7.1,61"""
      df = pnd.read_csv(StringIO(csv_texte))
      attendu = float(df.loc[df["Nom"] == "Fennec", "Poids_kg"].iloc[0])

      assert 'poids_fennec' in locals(), "Créez la variable poids_fennec."
      assert float(poids_fennec) == attendu, "Lisez le poids du Fennec dans le tableau."
      ```
    niveau: snt
    notion: Données structurées
  - id: donnees-4
    label: "Facile \U0001F98A - Filtrer un tableau"
    content: "### Facile \U0001F98A - Filtrer un tableau\n\n      Le **filtrage** permet de ne garder que les lignes qui correspondent à un critère (comme un filtre Excel).\n\n      **Mission :** À partir du `df` fourni, créez `df_desert` contenant **uniquement** les renards dont l'`Habitat` contient le mot `\"Désert\"`. Stockez le nombre de résultats dans `nb_resultats`.\n\n      ```python\n      import pandas as pnd\n      from io import StringIO\n\n      csv_texte = \"\"\"Nom,Espece,Habitat,Poids_kg,Longueur_cm\n      Rusty,Vulpes vulpes,Forêt tempérée,6.5,58\n      Arctic,Vulpes lagopus,Toundra arctique,3.2,46\n      Fennec,Vulpes zerda,Désert,1.5,24\n      Silver,Vulpes vulpes,Forêt boréale,7.1,61\"\"\"\n\n      df = pnd.read_csv(StringIO(csv_texte))\n      ```\n\n      *Indice :* `df[df[\"Habitat\"].str.contains(\"Désert\")]`"
    difficulty: facile
    type: sql
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      import pandas as pnd
      from io import StringIO

      csv_texte = """Nom,Espece,Habitat,Poids_kg,Longueur_cm
      Rusty,Vulpes vulpes,Forêt tempérée,6.5,58
      Arctic,Vulpes lagopus,Toundra arctique,3.2,46
      Fennec,Vulpes zerda,Désert,1.5,24
      Silver,Vulpes vulpes,Forêt boréale,7.1,61"""
      df = pnd.read_csv(StringIO(csv_texte))
      attendu = df[df["Habitat"].str.contains("Désert")]

      assert 'df_desert' in locals(), "Créez le DataFrame df_desert."
      assert 'nb_resultats' in locals(), "Créez la variable nb_resultats."
      assert len(df_desert) == len(attendu), "Le filtre doit garder les habitats contenant Désert."
      assert nb_resultats == len(attendu), "nb_resultats doit correspondre au filtre."
      ```
    niveau: snt
    notion: Données structurées
  - id: donnees-5
    label: "Facile \U0001F98A - Trier un tableau"
    content: "### Facile \U0001F98A - Trier un tableau\n\n      On peut **trier** un tableau par colonne, comme dans Excel.\n\n      **Mission :** Triez le `df` fourni par `Poids_kg` du plus léger au plus lourd. Stockez le résultat dans `df_trie` et le nom du renard le plus lourd dans `plus_lourd`.\n\n      ```python\n      import pandas as pnd\n      from io import StringIO\n\n      csv_texte = \"\"\"Nom,Espece,Habitat,Poids_kg,Longueur_cm\n      Rusty,Vulpes vulpes,Forêt tempérée,6.5,58\n      Arctic,Vulpes lagopus,Toundra arctique,3.2,46\n      Fennec,Vulpes zerda,Désert,1.5,24\n      Silver,Vulpes vulpes,Forêt boréale,7.1,61\"\"\"\n\n      df = pnd.read_csv(StringIO(csv_texte))\n      ```\n\n      *Indice :* `df.sort_values(\"Poids_kg\")` trie du plus petit au plus grand."
    difficulty: facile
    type: sql
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      import pandas as pnd
      from io import StringIO

      csv_texte = """Nom,Espece,Habitat,Poids_kg,Longueur_cm
      Rusty,Vulpes vulpes,Forêt tempérée,6.5,58
      Arctic,Vulpes lagopus,Toundra arctique,3.2,46
      Fennec,Vulpes zerda,Désert,1.5,24
      Silver,Vulpes vulpes,Forêt boréale,7.1,61"""
      df = pnd.read_csv(StringIO(csv_texte))
      attendu = df.sort_values("Poids_kg")

      assert 'df_trie' in locals(), "Créez le DataFrame df_trie."
      assert 'plus_lourd' in locals(), "Créez la variable plus_lourd."
      assert df_trie["Poids_kg"].tolist() == attendu["Poids_kg"].tolist(), "Triez par Poids_kg croissant."
      assert plus_lourd == attendu.iloc[-1]["Nom"], "plus_lourd est le renard le plus lourd du tableau."
      ```
    niveau: snt
    notion: Données structurées
  - id: donnees-6
    label: "Facile \U0001F98A - Lire un JSON"
    content: "### Facile \U0001F98A - Lire un JSON\n\n      Le module **`json`** (intégré à Python) permet de lire une fiche hiérarchique.\n\n      ```python\n      import json\n\n      fiche_texte = '''\n      {\n        \"renard\": {\n          \"nom\": \"Rusty\",\n          \"habitat\": {\n            \"type\": \"Forêt tempérée\",\n            \"region\": \"Europe\"\n          },\n          \"alimentation\": [\"rongeurs\", \"oiseaux\", \"insectes\", \"fruits\"]\n        }\n      }\n      '''\n      ```\n\n      **Mission :** Convertissez `fiche_texte` en dictionnaire `fiche` avec `json.loads()`, puis stockez :\n\n      - la `region` d'habitat dans `region`\n      - le nombre d'aliments dans `nb_aliments`"
    difficulty: facile
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      import json

      fiche_texte = '''
      {
        "renard": {
          "nom": "Rusty",
          "habitat": {
            "type": "Forêt tempérée",
            "region": "Europe"
          },
          "alimentation": ["rongeurs", "oiseaux", "insectes", "fruits"]
        }
      }
      '''
      fiche_ref = json.loads(fiche_texte)

      assert 'fiche' in locals(), "Créez le dictionnaire fiche."
      assert 'region' in locals(), "Créez la variable region."
      assert 'nb_aliments' in locals(), "Créez la variable nb_aliments."
      assert region == fiche_ref["renard"]["habitat"]["region"], "Lisez la région dans la structure JSON."
      assert nb_aliments == len(fiche_ref["renard"]["alimentation"]), "Comptez les aliments listés."
      ```
    niveau: snt
    notion: Données structurées
  - id: donnees-7
    label: "Facile \U0001F98A - Statistique sur une colonne"
    content: "### Facile \U0001F98A - Statistique sur une colonne\n\n      Pandas peut calculer des **statistiques** sur une colonne numérique (moyenne, maximum…).\n\n      **Mission :** À partir du `df` fourni, calculez la **moyenne** des poids dans `poids_moyen` et le **poids maximum** dans `poids_max`.\n\n      ```python\n      import pandas as pnd\n      from io import StringIO\n\n      csv_texte = \"\"\"Nom,Espece,Habitat,Poids_kg,Longueur_cm\n      Rusty,Vulpes vulpes,Forêt tempérée,6.5,58\n      Arctic,Vulpes lagopus,Toundra arctique,3.2,46\n      Fennec,Vulpes zerda,Désert,1.5,24\n      Silver,Vulpes vulpes,Forêt boréale,7.1,61\"\"\"\n\n      df = pnd.read_csv(StringIO(csv_texte))\n      ```\n\n      *Indice :* `df[\"Poids_kg\"].mean()` et `df[\"Poids_kg\"].max()`"
    difficulty: facile
    type: sql
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      import pandas as pnd
      from io import StringIO

      csv_texte = """Nom,Espece,Habitat,Poids_kg,Longueur_cm
      Rusty,Vulpes vulpes,Forêt tempérée,6.5,58
      Arctic,Vulpes lagopus,Toundra arctique,3.2,46
      Fennec,Vulpes zerda,Désert,1.5,24
      Silver,Vulpes vulpes,Forêt boréale,7.1,61"""
      df = pnd.read_csv(StringIO(csv_texte))

      assert 'poids_moyen' in locals(), "Créez la variable poids_moyen."
      assert 'poids_max' in locals(), "Créez la variable poids_max."
      assert abs(float(poids_moyen) - float(df["Poids_kg"].mean())) < 0.01, "Calculez la moyenne des poids."
      assert float(poids_max) == float(df["Poids_kg"].max()), "Trouvez le poids maximum."
      ```
    niveau: snt
    notion: Données structurées
