    label: Important ⚠️ - Avant de commencer
    content: |-
      ### Important ⚠️ - Avant de commencer

            Ce TP utilise des **bibliothèques Python** pour travailler sur la géolocalisation :

            | Bibliothèque | Usage |
            |-------------|-------|
            | **pandas** | Tableau de lieux avec latitude / longitude |
            | **folium** | Créer une carte interactive (comme Google Maps) |
            | **geopy** | Calculer une distance entre deux coordonnées GPS |

            **Dans le Lab NSI**, les modules sont chargés automatiquement avant l'exécution.

            **Rappel SNT :** une position GPS = **latitude** (Nord/Sud) + **longitude** (Est/Ouest), en degrés.

            **Exemple folium :**

            ```python
            import folium

            carte = folium.Map(location=[46.5, 2.5], zoom_start=6)
            folium.Marker([48.8566, 2.3522], popup="Paris").add_to(carte)
            print("Carte créée avec 1 marqueur")
            ```
    difficulty: moyen
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert True, "Consignes lues."
      ```
    niveau: snt
    notion: Localisation
  - id: loc-1
    label: "Introduction \U0001F98A - Tableau de villes"
    content: "### Introduction \U0001F98A - Tableau de villes\n\n      On peut stocker des lieux dans un **tableau pandas**, comme un fichier Excel de coordonnées GPS.\n\n      **Mission :** Créez un DataFrame `villes` à partir des données ci-dessous, puis stockez la **latitude de Lyon** dans `latitude_lyon`.\n\n      | Ville | Latitude | Longitude |\n      |-------|----------|-----------|\n      | Paris | 48.8566 | 2.3522 |\n      | Lyon | 45.7640 | 4.8357 |\n      | Marseille | 43.2965 | 5.3698 |\n\n      *Indice :* `pd.DataFrame({...})` ou une liste de dictionnaires. Pour lire une ville : `villes[villes[\"Ville\"] == \"Lyon\"]`."
    difficulty: introduction
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: >-
      ```python

      import pandas as pd


      villes_ref = pd.DataFrame({
          "Ville": ["Paris", "Lyon", "Marseille"],
          "Latitude": [48.8566, 45.7640, 43.2965],
          "Longitude": [2.3522, 4.8357, 5.3698],
      })


      assert 'villes' in locals(), "Créez le DataFrame villes."

      assert 'latitude_lyon' in locals(), "Créez la variable latitude_lyon."

      assert len(villes) == 3, "Le tableau doit contenir 3 villes."

      assert abs(float(latitude_lyon) - float(villes_ref.loc[villes_ref["Ville"] == "Lyon", "Latitude"].iloc[0])) <
      0.001

      ```
    niveau: snt
    notion: Localisation
  - id: loc-2
    label: "Introduction \U0001F98A - Distance GPS"
    content: "### Introduction \U0001F98A - Distance GPS\n\n      La bibliothèque **geopy** calcule la distance réelle entre deux points GPS (en kilomètres).\n\n      **Mission :** Calculez la distance en kilomètres entre **Paris** et **Marseille** (coordonnées dans le tableau ci-dessous). Stockez le résultat arrondi à **1 décimale** dans `distance_km`.\n\n      | Ville | Latitude | Longitude |\n      |-------|----------|-----------|\n      | Paris | 48.8566 | 2.3522 |\n      | Marseille | 43.2965 | 5.3698 |\n\n      *Indice :*\n\n      ```python\n      from geopy.distance import geodesic\n\n      distance = geodesic((lat1, lon1), (lat2, lon2)).km\n      ```"
    difficulty: introduction
    type: sql
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      from geopy.distance import geodesic

      paris = (48.8566, 2.3522)
      marseille = (43.2965, 5.3698)
      attendu = round(geodesic(paris, marseille).km, 1)

      assert 'distance_km' in locals(), "Créez la variable distance_km."
      assert abs(float(distance_km) - attendu) < 1.0, "Calculez la distance Paris → Marseille avec geopy."
      ```
    niveau: snt
    notion: Localisation
  - id: loc-3
    label: "Introduction \U0001F98A - Créer une carte"
    content: "### Introduction \U0001F98A - Créer une carte\n\n      **folium** permet de créer une **carte interactive** centrée sur des coordonnées.\n\n      **Mission :** Créez une carte `carte` centrée sur la France (`location=[46.5, 2.5]`, `zoom_start=6`).\n\n      Vérifiez que la carte est bien créée en stockant son niveau de zoom dans `zoom` (`carte.options['zoom']`).\n\n      *Indice :* `import folium` puis `folium.Map(location=[...], zoom_start=...)`"
    difficulty: introduction
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'carte' in locals(), "Créez une carte folium nommée carte."
      assert type(carte).__name__ == "Map", "carte doit être un objet folium.Map."
      assert 'zoom' in locals(), "Stockez le zoom dans la variable zoom."
      assert int(zoom) == 6, "Le zoom initial doit être 6."
      ```
    niveau: snt
    notion: Localisation
  - id: loc-4
    label: "Facile \U0001F98A - Placer des marqueurs"
    content: "### Facile \U0001F98A - Placer des marqueurs\n\n      On peut **placer des marqueurs** sur une carte folium, comme des points GPS.\n\n      **Mission :** Partez d'une carte centrée sur `[46.5, 2.5]` (zoom 6). Ajoutez **deux marqueurs** :\n\n      - Paris : `[48.8566, 2.3522]`, popup `\"Paris\"`\n      - Lyon : `[45.7640, 4.8357]`, popup `\"Lyon\"`\n\n      Stockez la carte dans `carte` et le **nombre de marqueurs ajoutés** dans `nb_marqueurs` (comptez les objets `Marker` dans `carte._children`).\n\n      *Indice :* `folium.Marker([lat, lon], popup=\"...\").add_to(carte)`"
    difficulty: facile
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'carte' in locals(), "Créez la variable carte."
      assert 'nb_marqueurs' in locals(), "Comptez les marqueurs dans nb_marqueurs."
      assert type(carte).__name__ == "Map", "carte doit être une folium.Map."
      assert nb_marqueurs == 2, "Ajoutez exactement 2 marqueurs (Paris et Lyon)."
      ```
    niveau: snt
    notion: Localisation
