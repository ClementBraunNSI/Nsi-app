  - id: loc-6
    label: "Facile \U0001F98A - Ville la plus au nord"
    content: "### Facile \U0001F98A - Ville la plus au nord\n\n      La **latitude** indique la position Nord/Sud : plus elle est élevée, plus on est au nord.\n\n      **Mission :** À partir du DataFrame `villes` fourni, trouvez la ville la plus au **nord** (latitude maximale) et stockez son nom dans `ville_nord`.\n\n      ```python\n      import pandas as pd\n\n      villes = pd.DataFrame({\n          \"Ville\": [\"Paris\", \"Lyon\", \"Marseille\", \"Lille\"],\n          \"Latitude\": [48.8566, 45.7640, 43.2965, 50.6292],\n          \"Longitude\": [2.3522, 4.8357, 5.3698, 3.0573],\n      })\n      ```\n\n      *Indice :* `villes.loc[villes[\"Latitude\"].idxmax(), \"Ville\"]`"
    difficulty: facile
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      import pandas as pd

      villes = pd.DataFrame({
          "Ville": ["Paris", "Lyon", "Marseille", "Lille"],
          "Latitude": [48.8566, 45.7640, 43.2965, 50.6292],
          "Longitude": [2.3522, 4.8357, 5.3698, 3.0573],
      })
      attendu = villes.loc[villes["Latitude"].idxmax(), "Ville"]

      assert 'ville_nord' in locals(), "Créez la variable ville_nord."
      assert ville_nord == attendu, "Trouvez la ville avec la latitude la plus élevée."
      ```
    niveau: snt
    notion: Localisation
  - id: loc-7
    label: "Facile \U0001F98A - Exporter la carte en HTML"
    content: "### Facile \U0001F98A - Exporter la carte en HTML\n\n      Une carte folium peut être **exportée en HTML**, comme une page web.\n\n      **Mission :** Créez une carte avec un marqueur sur la Tour Eiffel (`[48.8584, 2.2945]`, popup `\"Tour Eiffel\"`). Sauvegardez-la dans la variable texte `html_carte` avec `carte._repr_html_()`.\n\n      Vérifiez que le HTML contient bien le mot `\"Tour Eiffel\"` dans une variable booléenne `contient_nom`.\n\n      *Indice :* `html_carte = carte._repr_html_()` puis `\"Tour Eiffel\" in html_carte`"
    difficulty: facile
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'carte' in locals(), "Créez une carte folium."
      assert 'html_carte' in locals(), "Exportez la carte dans html_carte."
      assert 'contient_nom' in locals(), "Vérifiez le contenu dans contient_nom."
      assert isinstance(html_carte, str), "html_carte doit être une chaîne de caractères."
      assert contient_nom == True, "Le HTML de la carte doit mentionner Tour Eiffel."
      assert "Tour Eiffel" in html_carte, "Exportez correctement la carte avec le popup."
      ```
    niveau: snt
    notion: Localisation
