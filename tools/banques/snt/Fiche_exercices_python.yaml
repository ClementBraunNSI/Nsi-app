  - id: python-7
    label: "Introduction \U0001F98A - Calcul avec variables"
    content: "### Introduction \U0001F98A - Calcul avec variables\n\n      **Écrire un programme qui :**\n\n      - Crée deux variables `a` et `b` avec des nombres de votre choix\n      - Calcule leur somme dans une variable `somme`\n      - Affiche le résultat\n\n      ## \U0001F31F Niveau Facile"
    difficulty: introduction
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'a' in locals(), "La variable 'a' n'est pas définie."
      assert 'b' in locals(), "La variable 'b' n'est pas définie."
      assert 'somme' in locals(), "La variable 'somme' n'est pas définie."
      assert isinstance(a, (int, float)), "La variable 'a' doit être un nombre."
      assert isinstance(b, (int, float)), "La variable 'b' doit être un nombre."
      assert somme == a + b, "Le calcul de la somme est incorrect."
      ```
    niveau: snt
    notion: Programmation Python
