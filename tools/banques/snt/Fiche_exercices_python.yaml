  - id: python-9
    label: "Facile \U0001F98A - Calcul de périmètre"
    content: "### Facile \U0001F98A - Calcul de périmètre\n\n      **Écrire un programme qui demande la longueur et la largeur d'un rectangle et calcule son périmètre.**\n\n      *Utilisez les variables `longueur`, `largeur` et `perimetre`.*\n      *Rappel : Périmètre = 2 × (longueur + largeur)*"
    difficulty: facile
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'longueur' in locals(), "La variable 'longueur' n'est pas définie."
      assert 'largeur' in locals(), "La variable 'largeur' n'est pas définie."
      assert 'perimetre' in locals(), "La variable 'perimetre' n'est pas définie."
      assert isinstance(longueur, (int, float)), "La longueur doit être un nombre."
      assert isinstance(largeur, (int, float)), "La largeur doit être un nombre."
      assert perimetre == 2 * (longueur + largeur), "Le calcul du périmètre est incorrect."
      ```
    niveau: snt
    notion: Programmation Python
  - id: python-10
    label: "Facile \U0001F98A - Calcul d"
    content: "### Facile \U0001F98A - Calcul d'aire\n\n      **Écrire un programme qui demande le rayon d'un cercle et calcule son aire.**\n\n      *Utilisez les variables `rayon` et `aire`.*\n      *Rappel : Aire = π × rayon² (utilisez 3.14 pour π)*"
    difficulty: facile
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'rayon' in locals(), "La variable 'rayon' n'est pas définie."
      assert 'aire' in locals(), "La variable 'aire' n'est pas définie."
      assert isinstance(rayon, (int, float)), "Le rayon doit être un nombre."
      assert abs(aire - (3.14 * rayon ** 2)) < 0.01, "Le calcul de l'aire est incorrect."
      ```
    niveau: snt
    notion: Programmation Python
  - id: python-11
    label: "Facile \U0001F98A - Conversion de température"
    content: "### Facile \U0001F98A - Conversion de température\n\n      **Écrire un programme qui convertit une température de Celsius en Fahrenheit.**\n\n      *Utilisez les variables `celsius` et `fahrenheit`.*\n      *Formule : F = C × 9/5 + 32*"
    difficulty: facile
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'celsius' in locals(), "La variable 'celsius' n'est pas définie."
      assert 'fahrenheit' in locals(), "La variable 'fahrenheit' n'est pas définie."
      assert isinstance(celsius, (int, float)), "La température doit être un nombre."
      assert abs(fahrenheit - (celsius * 9/5 + 32)) < 0.01, "Le calcul de la conversion est incorrect."
      ```
    niveau: snt
    notion: Programmation Python
  - id: python-12
    label: "Facile \U0001F98A - Calcul de TVA"
    content: "### Facile \U0001F98A - Calcul de TVA\n\n      **Écrire un programme qui :**\n\n      - Demande un prix hors taxes (`prix_ht`)\n      - Calcule le montant de la TVA (20%) (`montant_tva`)\n      - Affiche le prix TTC (`prix_ttc`)"
    difficulty: facile
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'prix_ht' in locals(), "La variable 'prix_ht' n'est pas définie."
      assert 'montant_tva' in locals(), "La variable 'montant_tva' n'est pas définie."
      assert 'prix_ttc' in locals(), "La variable 'prix_ttc' n'est pas définie."
      assert isinstance(prix_ht, (int, float)), "Le prix HT doit être un nombre."
      assert abs(montant_tva - (prix_ht * 0.2)) < 0.01, "Le calcul de la TVA est incorrect."
      assert abs(prix_ttc - (prix_ht + montant_tva)) < 0.01, "Le calcul du prix TTC est incorrect."
      ```
    niveau: snt
    notion: Programmation Python
  - id: python-13
    label: "Facile \U0001F98A - Manipulation de chaînes"
    content: "### Facile \U0001F98A - Manipulation de chaînes\n\n      **Écrire un programme qui :**\n\n      - Demande le prénom et le nom de l'utilisateur (`prenom` et `nom`)\n      - Affiche son nom complet en majuscules dans une variable `nom_complet`\n\n      *Utilisez la méthode `.upper()` pour mettre en majuscules*\n\n      ## \U0001F525 Niveau Intermédiaire"
    difficulty: facile
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: >-
      assert 'prenom' in locals(), "La variable 'prenom' n'est pas définie."

      assert 'nom' in locals(), "La variable 'nom' n'est pas définie."

      assert 'nom_complet' in locals(), "La variable 'nom_complet' n'est pas définie."

      assert nom_complet == (prenom + " " + nom).upper() or nom_complet == (prenom + nom).upper() or nom_complet == (nom
      + " " + prenom).upper() or nom_complet == (nom + prenom).upper(), "Le nom complet n'est pas correctement formé ou
      mis en majuscules."
    niveau: snt
    notion: Programmation Python
  - id: python-14
    label: "Intermédiaire \U0001F98A\U0001F98A - Calculatrice simple"
    content: "### Intermédiaire \U0001F98A\U0001F98A - Calculatrice simple\n\n      **Écrire un programme qui demande deux nombres (`a` et `b`) et effectue les quatre opérations de base.**\n\n      *Stockez les résultats dans : `somme`, `difference`, `produit`, `quotient`.*"
    difficulty: !<tag:yaml.org,2002:js/undefined> ''
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'a' in locals(), "La variable 'a' n'est pas définie."
      assert 'b' in locals(), "La variable 'b' n'est pas définie."
      assert 'somme' in locals(), "La variable 'somme' n'est pas définie."
      assert 'difference' in locals(), "La variable 'difference' n'est pas définie."
      assert 'produit' in locals(), "La variable 'produit' n'est pas définie."
      assert 'quotient' in locals(), "La variable 'quotient' n'est pas définie."
      assert somme == a + b, "Erreur dans la somme."
      assert difference == a - b, "Erreur dans la différence."
      assert produit == a * b, "Erreur dans le produit."
      assert quotient == a / b, "Erreur dans le quotient."
      ```
    niveau: snt
    notion: Programmation Python
