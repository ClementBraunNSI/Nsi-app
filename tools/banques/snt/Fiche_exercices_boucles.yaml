  - id: boucles-2
    label: "Introduction \U0001F98A - Compte à rebours"
    content: "### Introduction \U0001F98A - Compte à rebours\n\n      **Écrire un programme qui :**\n\n      - Demande un nombre de départ\n      - Affiche le compte à rebours jusqu'à 0\n\n      *Pour la vérification, stockez le nombre de départ dans une variable `n` et la liste des nombres affichés dans une variable `rebours` (ex: `[5, 4, 3, 2, 1, 0]`).*"
    difficulty: introduction
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'n' in locals(), "La variable 'n' n'est pas définie."
      assert 'rebours' in locals(), "La variable 'rebours' n'est pas définie."
      assert isinstance(rebours, list), "La variable 'rebours' doit être une liste."
      assert rebours == list(range(n, -1, -1)), f"Le compte à rebours est incorrect pour n={n}."
      ```
    niveau: snt
    notion: Programmation Python
  - id: boucles-3
    label: "Introduction \U0001F98A - Tables de multiplication"
    content: "### Introduction \U0001F98A - Tables de multiplication\n\n      **Écrire un programme qui :**\n\n      - Demande un nombre\n      - Affiche sa table de multiplication de 1 à 10\n\n      *Pour la vérification, stockez le nombre choisi dans `n` et la liste des résultats dans `table` (ex: `[5, 10, ..., 50]`).*"
    difficulty: introduction
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'n' in locals(), "La variable 'n' n'est pas définie."
      assert 'table' in locals(), "La variable 'table' n'est pas définie."
      assert isinstance(table, list), "La variable 'table' doit être une liste."
      assert len(table) == 10, "La table doit contenir 10 valeurs."
      expected = [n * i for i in range(1, 11)]
      assert table == expected, f"La table de multiplication pour {n} est incorrecte."
      ```
    niveau: snt
    notion: Programmation Python
  - id: boucles-4
    label: "Introduction \U0001F98A - Escalier d"
    content: "### Introduction \U0001F98A - Escalier d'étoiles\n\n      **Écrire un programme qui :**\n\n      - Demande un nombre n\n      - Affiche un escalier de n marches avec des étoiles\n\n      *Astuce : pour afficher `x` fois un caractère, on peut utiliser la syntaxe `'x' * n`.*\n\n      *La chaîne de caractère \"XXXXX\" peut être créée via la syntaxe python suivante :*\n\n      ```python\n      chaine_1 = \"XXXXX\"\n      chaine_2 = \"X\"*5\n      # avec chaine_1 == chaine_2\n      ```\n\n      *Exemple pour n=3:*\n\n      ```\n      *\n      **\n      ***\n      ```\n\n      *Pour la vérification, stockez le nombre de marches dans `n` et la liste des lignes (chaînes de caractères) dans `lignes` (ex: `['*', '**', '***']`).*"
    difficulty: introduction
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'n' in locals(), "La variable 'n' n'est pas définie."
      assert 'lignes' in locals(), "La variable 'lignes' n'est pas définie."
      assert isinstance(lignes, list), "La variable 'lignes' doit être une liste."
      expected = ['*' * i for i in range(1, n + 1)]
      assert lignes == expected, f"L'escalier est incorrect pour n={n}."
      ```
    niveau: snt
    notion: Programmation Python
  - id: boucles-5
    label: "Introduction \U0001F98A - Somme des nombres"
    content: "### Introduction \U0001F98A - Somme des nombres\n\n      **Écrire un programme qui :**\n\n      - Demande un nombre n\n      - Calcule la somme des nombres de 1 à n\n      - Affiche le résultat\n\n      *Pour la vérification, stockez le nombre choisi dans `n` et le résultat dans `somme`.*"
    difficulty: introduction
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'n' in locals(), "La variable 'n' n'est pas définie."
      assert 'somme' in locals(), "La variable 'somme' n'est pas définie."
      expected = sum(range(1, n + 1))
      assert somme == expected, f"La somme des nombres de 1 à {n} doit être {expected}."
      ```
    niveau: snt
    notion: Programmation Python
  - id: boucles-6
    label: "Introduction \U0001F98A - Puissance de 2"
    content: "### Introduction \U0001F98A - Puissance de 2\n\n      **Écrire un programme qui :**\n\n      - Demande un nombre n\n      - Affiche les puissances de 2 jusqu'à 2^n\n\n      *Pour la vérification, stockez le nombre choisi dans `n` et la liste des puissances calculées dans `puissances` (ex: `[1, 2, 4, ..., 2^n]`).*"
    difficulty: introduction
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'n' in locals(), "La variable 'n' n'est pas définie."
      assert 'puissances' in locals(), "La variable 'puissances' n'est pas définie."
      assert isinstance(puissances, list), "La variable 'puissances' doit être une liste."
      expected = [2**i for i in range(n + 1)]
      assert puissances == expected, f"Les puissances de 2 jusqu'à 2^{n} sont incorrectes."
      ```
    niveau: snt
    notion: Programmation Python
  - id: boucles-7
    label: "Introduction \U0001F98A - Message répété"
    content: "### Introduction \U0001F98A - Message répété\n\n      **Écrire un programme qui :**\n\n      - Demande une phrase\n      - Demande un nombre de répétitions\n      - Affiche la phrase autant de fois que demandé\n\n      ## \U0001F31F Niveau Facile\n\n      *Pour la vérification, stockez la phrase dans `phrase`, le nombre de répétitions dans `n`, et créez une liste `resultats` contenant la phrase répétée `n` fois.*"
    difficulty: introduction
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'phrase' in locals(), "La variable 'phrase' n'est pas définie."
      assert 'n' in locals(), "La variable 'n' n'est pas définie."
      assert 'resultats' in locals(), "La variable 'resultats' n'est pas définie."
      assert isinstance(resultats, list), "La variable 'resultats' doit être une liste."
      assert len(resultats) == n, f"La liste doit contenir {n} éléments."
      assert all(r == phrase for r in resultats), "Tous les éléments doivent être égaux à la phrase."
      ```
    niveau: snt
    notion: Programmation Python
  - id: boucles-8
    label: "Facile \U0001F98A - Calculatrice continue"
    content: "### Facile \U0001F98A - Calculatrice continue\n\n      **Écrire un programme qui :**\n\n      - Demande deux nombres et une opération\n      - Affiche le résultat\n      - Demande si on veut continuer (oui/non)\n      - Recommence si la réponse est \"oui\"\n\n      ## \U0001F525 Niveau Intermédiaire\n\n      *Pour la vérification, assurez-vous que votre boucle se termine correctement quand on entre 'non'. Aucune variable spécifique n'est vérifiée automatiquement ici car cest un programme interactif.*"
    difficulty: facile
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
