      # Pas de vérification automatique stricte pour ce programme interactif complexe
      assert True
      ```
    niveau: snt
    notion: Programmation Python
  - id: boucles-9
    label: "Intermédiaire \U0001F98A\U0001F98A - Devinette avec limite"
    content: "### Intermédiaire \U0001F98A\U0001F98A - Devinette avec limite\n\n      **Écrire un programme qui :**\n\n      - Donne 5 essais pour deviner un nombre entre 1 et 100\n      - Affiche \"Perdu!\" si le nombre n'est pas trouvé après 5 essais\n      - Affiche le nombre d'essais utilisés en cas de victoire\n\n      *Pour la vérification, utilisez une variable `essais_restants` qui décrémente à chaque tour.*"
    difficulty: !<tag:yaml.org,2002:js/undefined> ''
    type: python
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: |-
      ```python
      assert 'essais_restants' in locals() or 'essais' in locals(), "Utilisez une variable pour compter les essais."
      ```
    niveau: snt
    notion: Programmation Python
