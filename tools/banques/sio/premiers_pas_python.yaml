              print(addition(a, b))
          elif op == "-":
              print(soustraction(a, b))
          elif op == "*":
              print(multiplication(a, b))
          elif op == "/":
              print(division(a, b))
          else:
              print("Opération inconnue")

      calculatrice()
      ```
