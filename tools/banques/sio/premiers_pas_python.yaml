  - id: python-conditions-2
    label: 2. Conditions
    content: >-
      ## Les structures conditionnelles


      ### ⚖️ La structure `if`


      ```python

      age = 18

      if age >= 18:
          print("Vous êtes majeur")
      ```

      Après `if`, écrire la condition, terminer par `:` et indenter le bloc exécuté si la condition est vraie.


      ### `if` – `else`


      ```python

      age = 15


      if age >= 18:
          print("Vous êtes majeur")
      else:
          print("Vous êtes mineur")
      ```


      ### `if` – `elif` – `else`


      Pour tester plusieurs conditions successives, utiliser `elif`.


      ```python

      note = 14


      if note >= 16:
          print("Très bien")
      elif note >= 14:
          print("Bien")
      elif note >= 12:
          print("Assez bien")
      elif note >= 10:
          print("Passable")
      else:
          print("Insuffisant")
      ```


      ### Opérateurs de comparaison


      | Opérateur | Signification | Exemple |

      | :---: | :--- | :--- |

      | `>` | supérieur | `3 > 1` |

      | `<` | inférieur | `3 < 1` |

      | `>=` | supérieur ou égal | `3 >= 1` |

      | `<=` | inférieur ou égal | `3 <= 1` |

      | `==` | égal à | `3 == 1` |

      | `!=` | différent de | `3 != 1` |


      **Attention** à ne pas confondre l'affectation `=` avec la comparaison `==`.


      ### Opérateurs logiques


      #### `and` (et)

      Les deux conditions doivent être vraies.

      ```python

      age = 20

      permis = True


      if age >= 18 and permis == True:
          print("Vous pouvez conduire")
      ```


      #### `or` (ou)

      Au moins une des conditions doit être vraie.

      ```python

      jour = "samedi"


      if jour == "samedi" or jour == "dimanche":
          print("C'est le week-end !")
      ```


      #### `not` (non)

      Inverse la condition.

      ```python

      pluie = False


      if not pluie:
          print("On peut sortir sans parapluie")
      ```


      ---


      ### Exercice 2.1 — Comparaison de deux nombres

      **Demander deux nombres à l'utilisateur et afficher lequel est le plus grand. Si les deux nombres sont égaux,
      afficher "Les nombres sont égaux".**


      <Correction>

      ```python

      a = int(input("Premier nombre ? "))

      b = int(input("Deuxième nombre ? "))

      if a > b:
          print("Le plus grand est", a)
      elif b > a:
          print("Le plus grand est", b)
      else:
          print("Les nombres sont égaux")
      ```

      </Correction>


      ### Exercice 2.2 — Vérification de longueur

      **Demander un mot à l'utilisateur. Si le mot contient plus de 5 lettres, afficher "Mot long", sinon afficher "Mot
      court".**

      *Indice : `len(s)` renvoie la longueur de la chaîne `s`.*


      <Correction>

      ```python

      mot = input("Entrez un mot : ")

      if len(mot) > 5:
          print("Mot long")
      else:
          print("Mot court")
      ```

      </Correction>


      ### Exercice 2.3 — Catégorie d'âge

      **Demander l'âge de l'utilisateur et afficher sa catégorie : 0–12 : Enfant ; 13–17 : Adolescent ; 18–59 : Adulte ;
      60+ : Senior.**


      <Correction>

      ```python

      age = int(input("Âge ? "))

      if age <= 12:
          print("Enfant")
      elif age <= 17:
          print("Adolescent")
      elif age <= 59:
          print("Adulte")
      else:
          print("Senior")
      ```

      </Correction>


      ### Exercice 2.4 — Calculatrice de moyenne

      **Demander deux notes à l'utilisateur et calculer leur moyenne. Si la moyenne ≥ 10 : afficher "Vous passez en
      classe supérieure" ; sinon : afficher "Vous devez redoubler".**


      <Correction>

      ```python

      a = float(input("Note 1 ? "))

      b = float(input("Note 2 ? "))

      m = (a + b) / 2

      if m >= 10:
          print("Vous passez en classe supérieure")
      else:
          print("Vous devez redoubler")
      ```

      </Correction>


      ### Exercice 2.5 — Prix du billet de train

      **Demander l'âge de l'utilisateur et la distance du trajet (km). Calculer le prix avec : base = distance × 0.20€ ;
      enfant (< 12) : −50% ; senior (≥ 65) : −30% ; si distance > 200 : −10€ supplémentaires. Afficher le prix final.**


      <Correction>

      ```python

      age = int(input("Âge ? "))

      dist = float(input("Distance (km) ? "))

      prix = dist * 0.20

      if age < 12:
          prix = prix * 0.5
      elif age >= 65:
          prix = prix * 0.7
      if dist > 200:
          prix = prix - 10
      if prix < 0:
          prix = 0
      print("Prix:", prix)

      ```

      </Correction>
