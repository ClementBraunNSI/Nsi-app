  - id: arbre-ex-2
    label: Parcours Infixe
    content: |-
      ### Affichage Infixe
          Écrivez une fonction récursive `afficher_infixe(noeud)` qui affiche les valeurs de l'arbre dans l'ordre infixe (Gauche - Racine - Droite).
          
          Testez avec l'arbre :
          ```
                10
               /  \
              5    15
          ```
          Cela devrait afficher : `5 10 15`
