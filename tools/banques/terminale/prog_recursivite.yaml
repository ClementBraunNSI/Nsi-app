    label: Fibonacci
    content: "### Suite de Fibonacci \U0001F430\n    La suite est définie par :\n    *   $F_0 = 0$\n    *   $F_1 = 1$\n    *   $F_n = F_{n-1} + F_{n-2}$ pour $n \\ge 2$\n    \n    Écrivez la fonction récursive `fibonacci(n)`."
