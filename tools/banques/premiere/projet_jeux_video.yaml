  - id: pjv-menu-1
    label: Menu Interactif
    content: >-
      Créez une fonction `menu_principal()` qui affiche les choix possibles et boucle indéfiniment jusqu'à ce que
      l'utilisateur choisisse de quitter.

            ```text
            ############### Gestionnaire de Jeux Vidéo ###############
            # Application réalisée par : Votre Nom                   #
            ##########################################################

            1. Ajouter un jeu  
            2. Afficher la collection complète  
            3. Rechercher un jeu  
            4. Modifier un jeu  
            5. Supprimer un jeu  
            6. Quitter  
            ```
