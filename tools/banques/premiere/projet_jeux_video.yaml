  - id: pjv-base-1
    label: Ajouter un jeu
    content: >-
      Créez une fonction `ajouter_jeu(ludotheque)` qui demande à l'utilisateur de saisir les informations (Titre,
      Plateforme, Année, Genre, Statut) et ajoute le jeu au dictionnaire `ludotheque`.
            
            *Indice : Utilisez `input()` pour récupérer les saisies.*
    difficulty: !<tag:yaml.org,2002:js/undefined> ''
    type: ouvert
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: !<tag:yaml.org,2002:js/undefined> ''
    niveau: premiere
    notion: Projets
  - id: pjv-base-2
    label: Afficher un jeu
    content: |-
      Créez une fonction `afficher_jeu(ludotheque, titre)` qui prend en paramètre la ludothèque et un titre de jeu.
            
            Si le jeu existe, elle doit afficher ses détails proprement, par exemple :
            ```text
            Titre : The Legend of Zelda: Breath of the Wild
            Plateforme : Switch
            Année : 2017
            Genre : Aventure
            Statut : Possédé
            ```
            Sinon, elle affiche un message d'erreur.
