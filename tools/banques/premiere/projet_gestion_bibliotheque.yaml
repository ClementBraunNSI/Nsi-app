questions:
  - id: lib-struct-1
    label: Initialisation
    content: Créez une liste vide `bibliotheque` qui contiendra tous les dictionnaires représentant les livres.
    difficulty: !<tag:yaml.org,2002:js/undefined> ''
    type: ouvert
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: !<tag:yaml.org,2002:js/undefined> ''
    niveau: premiere
    notion: Projets
  - id: lib-struct-2
    label: Ajout d
    content: |-
      Créez une fonction `ajouter_livre(bibliotheque, titre, auteur, annee, genre, isbn)` qui :
            1. Vérifie si un livre avec le même ISBN existe déjà.
            2. Si non, crée le dictionnaire et l'ajoute à la liste.
            3. Renvoie `True` si ajouté, `False` sinon.
    difficulty: !<tag:yaml.org,2002:js/undefined> ''
    type: ouvert
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: !<tag:yaml.org,2002:js/undefined> ''
    niveau: premiere
    notion: Projets
  - id: lib-struct-3
    label: Recherche
    content: |-
      Créez une fonction `rechercher_livres(bibliotheque, critere, valeur)` qui :
            1. Prend un `critere` ("titre", "auteur", etc.) et une `valeur`.
            2. Renvoie une liste des livres correspondants.
            
            Exemple : `rechercher_livres(bibliotheque, "auteur", "Victor Hugo")`.
    difficulty: !<tag:yaml.org,2002:js/undefined> ''
    type: ouvert
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: !<tag:yaml.org,2002:js/undefined> ''
    niveau: premiere
    notion: Projets
  - id: lib-struct-4
    label: Affichage
    content: 'Créez une fonction `afficher_livre(livre)` qui affiche les détails proprement (ex: "Titre : ... | Auteur : ...").'
    difficulty: !<tag:yaml.org,2002:js/undefined> ''
    type: ouvert
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: !<tag:yaml.org,2002:js/undefined> ''
    niveau: premiere
    notion: Projets
  - id: lib-data-1
    label: Sauvegarde
    content: |-
      Créez une fonction `sauvegarder(bibliotheque, nom_fichier)` qui écrit le contenu de la liste dans un fichier CSV.
            
            *Utilisez le module `csv` et `DictWriter`.*
    difficulty: !<tag:yaml.org,2002:js/undefined> ''
    type: ouvert
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: !<tag:yaml.org,2002:js/undefined> ''
    niveau: premiere
    notion: Projets
  - id: lib-data-2
    label: Chargement
    content: |-
      Créez une fonction `charger(nom_fichier)` qui :
            1. Lit le fichier CSV.
            2. Reconstruit la liste de dictionnaires (attention à convertir l'année en `int`).
            3. Renvoie la liste chargée (ou une liste vide si le fichier n'existe pas).
    difficulty: !<tag:yaml.org,2002:js/undefined> ''
    type: ouvert
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: !<tag:yaml.org,2002:js/undefined> ''
    niveau: premiere
    notion: Projets
  - id: lib-ui-1
    label: Menu Interactif
    content: |-
      Créez une fonction `menu_principal()` :

            ```text
            --- MA BIBLIOTHÈQUE ---
            1. Ajouter un livre
            2. Rechercher un livre
            3. Afficher tout
            4. Supprimer un livre (par ISBN)
            5. Sauvegarder et Quitter
            ```

            Le programme doit charger les données au démarrage et proposer de sauvegarder à la fermeture.
    difficulty: !<tag:yaml.org,2002:js/undefined> ''
    type: ouvert
    correction: !<tag:yaml.org,2002:js/undefined> ''
    verificationCode: !<tag:yaml.org,2002:js/undefined> ''
    niveau: premiere
    notion: Projets
  - id: lib-ui-2
    label: Suppression
    content: 'Implémentez l''option 4 : `supprimer_livre(bibliotheque, isbn)`.'
