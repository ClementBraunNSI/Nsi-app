  - id: exo-3-5
    label: 3.5 - Insertion
    content: |-
      ### Exercice 3.5 : Insertion
          **Insérer le nombre `7` à l'indice 1 dans `nombres`. Afficher la nouvelle liste.**
    difficulty: !<tag:yaml.org,2002:js/undefined> ''
    type: python
    correction: |-
