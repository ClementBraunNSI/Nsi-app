  - id: poke-fight-2
    label: Formule de Dégâts
    content: "Lors d'un combat, les dégâts sont calculés ainsi :\n\n      $$\n      \\texttt{degats} = \\frac{(((N \\times 0.4)+2) \\times \\texttt{Atq} \\times \\texttt{Puissance})}{\\texttt{Def} \\times 50} + 2\n      $$\n\n      Avec :\n      - $N$ : Niveau du Pokémon attaquant \U0001F4CA\n      - $Atq$ : Points d'attaque de l'attaquant ⚔️\n      - $Puissance$ : Puissance de l'attaque utilisée \U0001F4A5\n      - $Def$ : Points de défense de la cible \U0001F6E1️\n\n      Implémentez la fonction `calculer_degats(attaquant, defenseur, nom_attaque, dico_attaques)`."
